// ========== 产品维护操作 ==========

function toggleProductOnline(idx) {
  productMaintList[idx].online = !productMaintList[idx].online;
  saveProductMaintList();
  renderProductMaintPage();
  if (currentTab === 'position') renderPositionPage();
}

function toggleProductCalcLive(idx) {
  productMaintList[idx].calcLive = !productMaintList[idx].calcLive;
  saveProductMaintList();
  renderProductMaintPage();
  if (currentTab === 'position') renderPositionPage();
}

function onSortOrderChange(idx, val) {
  const num = parseInt(val);
  if (!isNaN(num) && num >= 1) {
    productMaintList[idx].sortOrder = num;
    // 重新排序整个列表
    productMaintList.sort((a, b) => a.sortOrder - b.sortOrder);
    // 重新编号
    productMaintList.forEach((p, i) => { p.sortOrder = i + 1; });
  }
  saveProductMaintList();
  renderProductMaintPage();
  if (currentTab === 'position') renderPositionPage();
}

function renumberSortOrder() {
  productMaintList.forEach((p, i) => { p.sortOrder = i + 1; });
  saveProductMaintList();
  renderProductMaintPage();
  if (currentTab === 'position') renderPositionPage();
}

// ========== Tab 切换 ==========

function switchMaintOnlineTab(tab) {
  maintOnlineTab = tab;
  renderProductMaintPage();
}

// ========== 搜索过滤 ==========

function onMaintFilterChange() {
  maintFilterName = document.getElementById('maintFilterName').value;
  maintFilterLive = document.getElementById('maintFilterLive').value;
  renderProductMaintPage();
}

// HTML 转义辅助函数
function escHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

// ========== 拖拽排序 ==========

function onMaintDragStart(e, idx) {
  maintDragSrc = idx;
  e.target.closest('tr').style.opacity = '0.5';
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(idx));
}

function onMaintDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const tr = e.target.closest('tr');
  if (tr) tr.classList.add('drag-over');
}

function onMaintDragLeave(e) {
  const tr = e.target.closest('tr');
  if (tr) tr.classList.remove('drag-over');
}

function onMaintDrop(e, targetIdx) {
  e.preventDefault();
  if (maintDragSrc === null || maintDragSrc === targetIdx) return;

  // 获取当前 Tab 的数组（上线或下线），再映射到 productMaintList 真实索引
  const tabList = productMaintList.filter(p => p.online === (maintOnlineTab === 'online'));
  const srcRealIdx = productMaintList.findIndex(p => p.code === tabList[maintDragSrc].code);
  const targetRealIdx = productMaintList.findIndex(p => p.code === tabList[targetIdx].code);
  if (srcRealIdx === -1 || targetRealIdx === -1) return;

  // 移动元素
  const [moved] = productMaintList.splice(srcRealIdx, 1);
  productMaintList.splice(targetRealIdx, 0, moved);
  // 重新编号
  productMaintList.forEach((p, i) => { p.sortOrder = i + 1; });
  maintDragSrc = null;
  saveProductMaintList();
  renderProductMaintPage();
  if (currentTab === 'position') renderPositionPage();
}

function onMaintDragEnd(e) {
  e.target.closest('tr').style.opacity = '';
  document.querySelectorAll('.product-maint-table tbody tr').forEach(tr => tr.classList.remove('drag-over'));
  maintDragSrc = null;
}

// ========== 新增理财产品 ==========

function showAddProductModal() {
  const modal = document.getElementById('addProductModal');
  document.getElementById('newProductCode').value = '';
  document.getElementById('newProductName').value = '';
  document.getElementById('newProductCalcLive').value = 'true';
  document.getElementById('newProductSortOrder').value = '';
  document.getElementById('addProductHint').style.display = 'none';
  document.getElementById('addProductHint').textContent = '';
  modal.classList.add('show');
  setTimeout(() => document.getElementById('newProductCode').focus(), 50);
}

function closeAddProductModal() {
  document.getElementById('addProductModal').classList.remove('show');
}

function confirmAddProduct() {
  const codeInput = document.getElementById('newProductCode');
  const nameInput = document.getElementById('newProductName');
  const liveInput = document.getElementById('newProductCalcLive');
  const hint = document.getElementById('addProductHint');

  const code = (codeInput.value || '').trim();
  const name = (nameInput.value || '').trim();
  const online = true; // 默认上线

  if (!code) {
    hint.textContent = '请输入产品代码';
    hint.style.display = 'block';
    codeInput.focus();
    return;
  }
  if (!name) {
    hint.textContent = '请输入产品名称';
    hint.style.display = 'block';
    nameInput.focus();
    return;
  }
  if (productMaintList.some(p => p.code === code)) {
    hint.textContent = '产品代码已存在，请勿重复添加';
    hint.style.display = 'block';
    codeInput.focus();
    return;
  }

  // 手动排序
  const sortInput = document.getElementById('newProductSortOrder');
  const sortOrder = parseInt(sortInput?.value) || productMaintList.length + 1;

  // 计算活期
  const calcLive = liveInput.value === 'true';

  // 添加到维护列表
  productMaintList.push({
    code: code,
    name: name,
    online: online,
    sortOrder: sortOrder,
    calcLive: calcLive
  });
  productMaintList.sort((a, b) => a.sortOrder - b.sortOrder);

  // 同时补充到 positionData，避免头寸页找不到数据
  if (!positionData.some(p => p.code === code)) {
    positionData.push(createDefaultPositionRow(code, name));
  }

  saveProductMaintList();
  savePositionData();
  renumberSortOrder();
  closeAddProductModal();
}

function getSpvOnlineList() {
  // 三态Tab：online=上线中, offline=已下线, terminated=已清仓
  if (spvMaintOnlineTab === 'online') return spvMaintList.filter(p => p.online && !p.terminated);
  if (spvMaintOnlineTab === 'offline') return spvMaintList.filter(p => !p.online && !p.terminated);
  if (spvMaintOnlineTab === 'terminated') return spvMaintList.filter(p => p.terminated);
  return [];
}

function getSpvFilteredList() {
  const list = getSpvOnlineList();
  const q = spvMaintFilter.trim().toLowerCase();
  if (!q) return list;
  return list.filter(p => {
    const acc = allAccounts.find(a => a.id === p.id);
    if (!acc) return false;
    return acc.name.toLowerCase().includes(q) || acc.code.toLowerCase().includes(q);
  });

        return `<button ${p===spvMaintPageIdx?'style="background:var(--primary);color:#fff;"':''} onclick="spvMaintPageIdx=${p};renderSpvMaintPage()">${p+1}</button>`;
      }).join('')}
      <button ${spvMaintPageIdx>=totalPages-1?'disabled':''} onclick="spvMaintPageIdx++;renderSpvMaintPage()">下一页</button>
    </div>
  `;
}

function switchSpvMaintTab(tab) {
  spvMaintOnlineTab = tab;
  spvMaintPageIdx = 0;
  renderSpvMaintPage();
}

// ==================== SPV持仓查询 ====================
let spvQueryFilter = '';
let spvQueryExpanded = {}; // { productCode: true }
let spvQueryExpandedSpv = {}; // { spvCode: true }
let spvQueryDate = '2026-08-14'; // 当前选中日期
let spvQueryDimension = 'product'; // 'product' 按理财产品 / 'spv' 按专户产品
const spvQueryDateList = ['2026-08-11', '2026-08-12', '2026-08-13', '2026-08-14'];

// 模拟历史日期快照：不同日期包含不同数量的产品（Demo 演示用）
function getSpvQueryDateCodes(date) {
  const total = positionData.length;
  const idx = spvQueryDateList.indexOf(date);
  const count = total - (spvQueryDateList.length - 1 - idx) * 6;
  return positionData.slice(0, Math.max(8, count)).map(p => p.code);
}

function renderSpvQueryPage() {
  if (spvQueryDimension === 'product') {
    renderSpvQueryByProduct();
  } else {
    renderSpvQueryBySpv();
  }
}

function renderSpvQueryByProduct() {
  const container = document.getElementById('spvQueryContent');
  const q = spvQueryFilter.trim().toLowerCase();
  // 按日期过滤 + 搜索过滤
  const dateCodes = getSpvQueryDateCodes(spvQueryDate);
  const products = positionData.filter(p => {
    if (!dateCodes.includes(p.code)) return false;
    if (!q) return true;
    return p.code.toLowerCase().includes(q) || p.name.toLowerCase().includes(q);
  });

  // 按维护状态排序：已上线(0) > 未上线(1) > 已下线(2)
  products.sort((a, b) => {
    const rank = (p) => {
      const m = productMaintList.find(x => x.code === p.code);
      if (m && m.online) return 0;
      if (m && !m.online) return 2;
      return 1;
    };
    return rank(a) - rank(b);
  });

  // 统计汇总
  const totalProducts = products.length;
  const onlineCount = products.filter(p => {
    const m = productMaintList.find(m => m.code === p.code);
    return m && m.online;
  }).length;
  const totalSpvRows = products.reduce((sum, p) => sum + getSPVData(p.code).length, 0);

  let rowsHTML = '';
  if (products.length === 0) {
    rowsHTML = '<tr><td colspan="10" class="spvq-empty">未找到匹配产品</td></tr>';
  } else {
    rowsHTML = products.map(p => {
      const holdings = getSPVData(p.code);
      const isExpanded = spvQueryExpanded[p.code];

      // 维护状态
      const maintItem = productMaintList.find(m => m.code === p.code);
      let statusLabel, statusClass;
      if (maintItem && maintItem.online) { statusLabel = '已上线'; statusClass = 'online'; }
      else if (maintItem && !maintItem.online) { statusLabel = '已下线'; statusClass = 'offline'; }
      else { statusLabel = '未上线'; statusClass = 'unmaint'; }

      // 持有专户总规模
      const totalScale = holdings.reduce((sum, h) => sum + (h.scale || (h.qty * h.nav) || 0), 0);

      // 一级行
      let row = `
        <tr class="spvq-lv1-row${isExpanded ? ' expanded' : ''}" data-code="${escHtml(p.code)}" onclick="toggleSpvQuery('${escHtml(p.code)}')">
          <td><span class="toggle-icon">▶</span> <span class="prod-code">${escHtml(p.code)}</span></td>
          <td>${escHtml(p.name)}</td>
          <td class="center"><span class="spvq-status-tag ${statusClass}">${statusLabel}</span></td>
          <td class="center">${escHtml(p.date || '--')}</td>
          <td class="num">${holdings.length}</td>
          <td class="num">${fmtNum(totalScale)}</td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>`;

      // 二级行（展开时显示）
      if (isExpanded) {
        if (holdings.length === 0) {
          row += `
            <tr class="spvq-lv2-row">
              <td colspan="10" class="indent" style="color:var(--text-muted);font-style:italic;">暂无专户持仓数据</td>
            </tr>`;
        } else {
          holdings.forEach(h => {
            const scale = h.scale || (h.qty * h.nav) || 0;
            const pct = totalScale > 0 ? (scale / totalScale * 100).toFixed(2) + '%' : '--';
            row += `
              <tr class="spvq-lv2-row">
                <td class="indent" style="font-weight:500;color:var(--primary);">${escHtml(h.spvCode)}</td>
                <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escHtml(h.spvName)}">${escHtml(h.spvName)}</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td class="num">${h.nav ? h.nav.toFixed(4) : '--'}</td>
                <td class="num">${fmtNum(scale)}</td>
                <td class="num">${fmtNum(h.qty || 0)}</td>
                <td class="num">${pct}</td>
              </tr>`;
          });
        }
      }
      return row;
    }).join('');
  }

  container.innerHTML = `
    <div class="maint-tabs" style="margin-bottom:12px;">
      <div class="maint-tab ${spvQueryDimension === 'product' ? 'active' : ''}" onclick="switchSpvQueryDimension('product')">按理财产品</div>
      <div class="maint-tab ${spvQueryDimension === 'spv' ? 'active' : ''}" onclick="switchSpvQueryDimension('spv')">按专户产品</div>
    </div>
    <div class="product-maint-notice">
      <span class="notice-icon">💡</span>
      <div><strong>说明：</strong>本页展示每日导入《SPV持仓》文件中的全部理财产品及对应专户持仓，为只读数据记录，不做任何操作。点击行可展开/收起明细。<br><span style="color:#C2410C;">当前为 Demo 模拟数据，实际对接《SPV持仓》文件导入接口后自动填充全量产品。</span></div>
    </div>
    <div class="product-maint-toolbar">
      <label style="font-size:12px;color:var(--text-secondary);">导入日期</label>
      <select class="form-select" id="spvQueryDate" onchange="spvQueryDate=this.value;renderSpvQueryPage()" style="width:130px;">
        ${spvQueryDateList.map(d => `<option value="${d}" ${d === spvQueryDate ? 'selected' : ''}>${d}</option>`).join('')}
      </select>
      <span class="toolbar-divider"></span>
      <input type="text" class="form-input" id="spvQueryFilter" placeholder="搜索产品代码或名称" value="${escHtml(spvQueryFilter)}"
        style="width:260px;" onkeydown="if(event.key==='Enter')doSpvQuerySearch()">
      <button onclick="doSpvQuerySearch()" style="padding:6px 14px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:var(--primary);color:#fff;cursor:pointer;">查询</button>
      <span style="font-size:13px;color:var(--text-secondary);">共 <strong style="color:var(--text);">${totalProducts}</strong> 只理财产品</span>
      <span style="flex:1;"></span>
      <button onclick="expandAllSpvQuery(true)" style="padding:4px 10px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;">全部展开</button>
      <button onclick="expandAllSpvQuery(false)" style="padding:4px 10px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;">全部收起</button>
    </div>
    <div class="section-card" style="margin-top:12px;">
      <div class="table-container" style="max-height:65vh;">
        <table class="spvq-table">
          <thead class="lv1">
            <tr>
              <th style="width:160px;">产品代码</th>
              <th>产品名称</th>
              <th class="center" style="width:90px;">维护状态</th>
              <th class="center" style="width:110px;">导入日期</th>
              <th class="num" style="width:80px;">专户数</th>
              <th class="num" style="width:140px;">持有专户总规模（元）</th>
              <th class="num" style="width:100px;">单位净值</th>
              <th class="num" style="width:140px;">持有规模（元）</th>
              <th class="num" style="width:100px;">持有份额</th>
              <th class="num" style="width:100px;">占比</th>
            </tr>
          </thead>
          <tbody>${rowsHTML}</tbody>
        </table>
      </div>
      <div class="spvq-summary-bar">
        <div class="ss-item">共 <span class="ss-value">${totalProducts}</span> 个理财产品</div>
        <div class="ss-item">已上线 <span class="ss-value" style="color:#6D28D9;">${onlineCount}</span></div>
        <div class="ss-item">未上线 <span class="ss-value" style="color:#C2410C;">${totalProducts - onlineCount}</span></div>
        <div class="ss-item">专户持仓明细 <span class="ss-value">${totalSpvRows}</span> 条</div>
      </div>
    </div>
  `;
}

function toggleSpvQuery(code) {
  spvQueryExpanded[code] = !spvQueryExpanded[code];
  renderSpvQueryPage();
}

function doSpvQuerySearch() {
  spvQueryFilter = document.getElementById('spvQueryFilter')?.value || '';
  renderSpvQueryPage();
}

function expandAllSpvQuery(expand) {
  if (spvQueryDimension === 'product') {
    if (expand) { positionData.forEach(p => { spvQueryExpanded[p.code] = true; }); }

      positionData.forEach(p => { getSPVData(p.code).forEach(h => { spvQueryExpandedSpv[h.spvCode] = true; }); });

  spvQueryDimension = dim;

function toggleSpvQuerySpv(code) {

}

// 专户维护状态（真实逻辑从 spvMaintList 判断；Demo 模拟部分专户状态）
function getSpvMaintStatus(spvCode) {
  const spvMaint = spvMaintList.find(m => {
    const a = allAccounts.find(ac => ac.id === m.id);
    return a && a.code === spvCode;
  });
  if (spvMaint && spvMaint.terminated) return { label: '已清仓', cls: 'terminated' };
  if (spvMaint && spvMaint.online) return { label: '上线中', cls: 'online' };
  if (spvMaint && !spvMaint.online) return { label: '已下线', cls: 'offline' };
  const demoMap = {
    'ZTQX08': 'online', 'ZTYS19': 'online',
    '2021-1147': 'offline', 'B42146': 'offline',
    '6666666666': 'terminated',
  };
  const s = demoMap[spvCode];
  if (s === 'online') return { label: '上线中', cls: 'online' };
  if (s === 'offline') return { label: '已下线', cls: 'offline' };
  if (s === 'terminated') return { label: '已清仓', cls: 'terminated' };
  return { label: '未上线', cls: 'unmaint' };
}

// 按专户维度渲染
function renderSpvQueryBySpv() {
  const container = document.getElementById('spvQueryContent');
  const q = spvQueryFilter.trim().toLowerCase();
  const dateCodes = getSpvQueryDateCodes(spvQueryDate);

  // 提取所有专户（去重），聚合被哪些产品持有
  const spvMap = {};
  positionData.forEach(p => {
    if (!dateCodes.includes(p.code)) return;
    const holdings = getSPVData(p.code);
    holdings.forEach(h => {
      if (!spvMap[h.spvCode]) {
        spvMap[h.spvCode] = { spvCode: h.spvCode, spvName: h.spvName, nav: h.nav, products: [] };
      }
      const scale = h.scale || (h.qty * h.nav) || 0;
      spvMap[h.spvCode].products.push({ code: p.code, name: p.name, scale, qty: h.qty || 0 });
    });
  });

  let spvList = Object.values(spvMap);
  if (q) {
    spvList = spvList.filter(s =>
      (s.spvCode || '').toLowerCase().includes(q) || (s.spvName || '').toLowerCase().includes(q)
    );
  }

  // 按维护状态排序：上线中(0) > 未上线(1) > 已下线(2) > 已清仓(3)
  spvList.sort((a, b) => {
    const rank = (s) => {
      const st = getSpvMaintStatus(s.spvCode);
      if (st.cls === 'online') return 0;
      if (st.cls === 'unmaint') return 1;
      if (st.cls === 'offline') return 2;
      return 3;
    };
    return rank(a) - rank(b);
  });

  // 汇总统计
  const spvCount = spvList.length;
  const onlineSpvCount = spvList.filter(s => getSpvMaintStatus(s.spvCode).cls === 'online').length;
  const unmaintSpvCount = spvList.filter(s => getSpvMaintStatus(s.spvCode).cls === 'unmaint').length;
  const terminatedSpvCount = spvList.filter(s => getSpvMaintStatus(s.spvCode).cls === 'terminated').length;
  const totalProductRows = spvList.reduce((sum, s) => sum + s.products.length, 0);

  let rowsHTML = '';
  if (spvList.length === 0) {
    rowsHTML = '<tr><td colspan="8" class="spvq-empty">未找到匹配专户</td></tr>';
  } else {
    rowsHTML = spvList.map(s => {
      const isExpanded = spvQueryExpandedSpv[s.spvCode];
      const totalScale = s.products.reduce((sum, p) => sum + p.scale, 0);
      const st = getSpvMaintStatus(s.spvCode);
      let row = `
        <tr class="spvq-lv1-row${isExpanded ? ' expanded' : ''}" onclick="toggleSpvQuerySpv('${escHtml(s.spvCode)}')" style="cursor:pointer;">
          <td><span class="toggle-icon">▶</span> <span class="prod-code">${escHtml(s.spvCode)}</span></td>
          <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escHtml(s.spvName)}">${escHtml(s.spvName)}</td>
          <td class="center"><span class="spvq-status-tag ${st.cls}">${st.label}</span></td>
          <td class="num">${s.nav ? s.nav.toFixed(4) : '--'}</td>
          <td class="num">${s.products.length}</td>
          <td class="num">${fmtNum(totalScale)}</td>
          <td></td><td></td>
        </tr>`;

      if (isExpanded) {
        s.products.forEach(p => {
          const pct = totalScale > 0 ? (p.scale / totalScale * 100).toFixed(2) + '%' : '--';
          row += `
            <tr class="spvq-lv2-row">
              <td class="indent" style="font-weight:500;color:var(--primary);">${escHtml(p.code)}</td>
              <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escHtml(p.name)}">${escHtml(p.name)}</td>
              <td></td>
              <td></td>
              <td></td>
              <td class="num">${fmtNum(p.scale)}</td>
              <td class="num">${fmtNum(p.qty)}</td>
              <td class="num">${pct}</td>
            </tr>`;
        });
      }
      return row;
    }).join('');
  }

  container.innerHTML = `
    <div class="maint-tabs" style="margin-bottom:12px;">
      <div class="maint-tab ${spvQueryDimension === 'product' ? 'active' : ''}" onclick="switchSpvQueryDimension('product')">按理财产品</div>
      <div class="maint-tab ${spvQueryDimension === 'spv' ? 'active' : ''}" onclick="switchSpvQueryDimension('spv')">按专户产品</div>
    </div>
    <div class="product-maint-notice">
      <span class="notice-icon">💡</span>
      <div><strong>说明：</strong>本页展示每日导入《SPV持仓》文件中的全部专户及被哪些理财产品持有，为只读数据记录。点击专户行可展开查看持有该专户的产品明细。<br><span style="color:#C2410C;">当前为 Demo 模拟数据，实际对接《SPV持仓》文件导入接口后自动填充全量数据。</span></div>
    </div>
    <div class="product-maint-toolbar">
      <label style="font-size:12px;color:var(--text-secondary);">导入日期</label>
      <select class="form-select" onchange="spvQueryDate=this.value;renderSpvQueryPage()" style="width:130px;">
        ${spvQueryDateList.map(d => `<option value="${d}" ${d === spvQueryDate ? 'selected' : ''}>${d}</option>`).join('')}
      </select>
      <span class="toolbar-divider"></span>
      <input type="text" class="form-input" id="spvQueryFilter" placeholder="搜索专户代码或名称" value="${escHtml(spvQueryFilter)}"
        style="width:260px;" onkeydown="if(event.key==='Enter')doSpvQuerySearch()">
      <button onclick="doSpvQuerySearch()" style="padding:6px 14px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:var(--primary);color:#fff;cursor:pointer;">查询</button>
      <span style="font-size:13px;color:var(--text-secondary);">共 <strong style="color:var(--text);">${spvCount}</strong> 个专户</span>
      <span style="flex:1;"></span>
      <button onclick="expandAllSpvQuery(true)" style="padding:4px 10px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;">全部展开</button>
      <button onclick="expandAllSpvQuery(false)" style="padding:4px 10px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;">全部收起</button>

              <th style="width:160px;">专户代码</th>
              <th>专户名称</th>
              <th class="center" style="width:90px;">维护状态</th>
              <th class="num" style="width:100px;">单位净值</th>
              <th class="num" style="width:90px;">持有产品数</th>

        <div class="ss-item">未上线 <span class="ss-value" style="color:#C2410C;">${unmaintSpvCount}</span></div>
        <div class="ss-item">已清仓 <span class="ss-value" style="color:#6B7280;">${terminatedSpvCount}</span></div>
        <div class="ss-item">理财产品持仓明细 <span class="ss-value">${totalProductRows}</span> 条</div>

function onSpvMaintFilterChange() {
  spvMaintFilter = document.getElementById('spvMaintFilter').value;
  spvMaintPageIdx = 0;
  renderSpvMaintPage();
}

function onSpvShortNameChange(idx, val) {
  if (!spvMaintList[idx].online) return;
  spvMaintList[idx].shortName = val;
  saveSpvMaintList();
}

function onSpvTvalChange(idx, val) {
  if (!spvMaintList[idx].online) { renderSpvMaintPage(); return; }
  if (!confirm('确认将专户时效修改为 ' + val + ' ？')) { renderSpvMaintPage(); return; }
  spvMaintList[idx].tVal = val;
  saveSpvMaintList();
}

function onSpvNatureChange(idx, val) {
  if (!spvMaintList[idx].online) { renderSpvMaintPage(); return; }
  if (!confirm('确认将专户性质修改为 ' + val + ' ？')) { renderSpvMaintPage(); return; }
  spvMaintList[idx].nature = val;
  saveSpvMaintList();
}

function toggleSpvOnline(idx) {
  const item = spvMaintList[idx];
  if (item.terminated) return; // 已清仓为终态，禁止任何状态切换
  const accName = (allAccounts.find(a => a.id === item.id) || {}).name || '该专户';

  const finishToggle = () => {
    // 重新排列在线产品的序号
    const onlineList = spvMaintList.filter(p => p.online && !p.terminated);
    onlineList.forEach((p, i) => { p.sortOrder = i + 1; });
    saveSpvMaintList();
    renderSpvMaintPage();
  };

  if (item.online) {
    // 上线 → 下线：需确认
    showConfirmDialog({
      title: '下线专户',
      bodyHTML: `
        <p style="font-size:14px;color:var(--text);margin-bottom:12px;">确认将「<strong>${escHtml(accName)}</strong>」下线？</p>
        <div style="background:#FEF2F2;border:1px solid #FECACA;border-radius:6px;padding:10px 12px;font-size:13px;color:#991B1B;">⚠️ 下线后该专户在头寸管理页面不再展示。</div>`,
      confirmText: '确认下线',
      danger: true,
      onConfirm: () => { item.online = false; finishToggle(); }
    });
  } else {
    // 下线 → 上线：恢复展示，移动到上线列表末尾
    showConfirmDialog({
      title: '上线专户',
      bodyHTML: `
        <p style="font-size:14px;color:var(--text);margin-bottom:4px;">确认将「<strong>${escHtml(accName)}</strong>」上线？</p>
        <p style="font-size:13px;color:var(--text-muted);">上线后该专户将在头寸管理页面展示。</p>`,
      confirmText: '确认上线',
      onConfirm: () => {
        item.online = true;
        spvMaintList.splice(idx, 1);
        let lastOnline = -1;
        spvMaintList.forEach((p, i) => { if (p.online && !p.terminated) lastOnline = i; });
        spvMaintList.splice(lastOnline + 1, 0, item);
        finishToggle();
      }
    });
  }
}

function terminateSpv(idx) {
  const item = spvMaintList[idx];
  if (item.terminated) return; // 已清仓不可重复操作
  const accName = (allAccounts.find(a => a.id === item.id) || {}).name || '该专户';
  showConfirmDialog({
    title: '清仓专户',
    bodyHTML: `
      <p style="font-size:14px;color:var(--text);margin-bottom:12px;">确认将「<strong>${escHtml(accName)}</strong>」清仓？</p>
      <div style="background:#FEF2F2;border:1px solid #FECACA;border-radius:6px;padding:10px 12px;font-size:13px;color:#991B1B;">⚠️ 清仓为终态操作，清仓后不可恢复上线，仅保留在「已清仓」Tab 中。</div>`,
    confirmText: '确认清仓',
    danger: true,
    onConfirm: () => {
      item.online = false;
      item.terminated = true;
      // 重新排列在线产品的序号
      const onlineList = spvMaintList.filter(p => p.online && !p.terminated);
      onlineList.forEach((p, i) => { p.sortOrder = i + 1; });
      saveSpvMaintList();
      renderSpvMaintPage();
    }
  });
}

function onSpvSortOrderChange(idx, val) {
  const num = parseInt(val);
  if (!isNaN(num) && num >= 1) {
    spvMaintList[idx].sortOrder = num;
    spvMaintList.sort((a, b) => a.sortOrder - b.sortOrder);
    spvMaintList.forEach((p, i) => { p.sortOrder = i + 1; });
  }
  saveSpvMaintList();
  renderSpvMaintPage();
}

function onSpvMaintDragStart(e, idx) {
  spvMaintDragSrc = idx;
  e.target.closest('tr').style.opacity = '0.5';
  e.dataTransfer.effectAllowed = 'move';
}
function onSpvMaintDragOver(e) { e.preventDefault(); const tr = e.target.closest('tr'); if (tr) tr.classList.add('drag-over'); }
function onSpvMaintDragLeave(e) { const tr = e.target.closest('tr'); if (tr) tr.classList.remove('drag-over'); }
function onSpvMaintDrop(e, targetIdx) {
  e.preventDefault();
  if (spvMaintDragSrc === null || spvMaintDragSrc === targetIdx) return;
  const tabList = getSpvOnlineList(); // 与渲染层同源的三态Tab过滤
  const srcId = tabList[spvMaintDragSrc].id;
  const targetId = tabList[targetIdx].id;
  const srcRealIdx = spvMaintList.findIndex(p => p.id === srcId);
  const targetRealIdx = spvMaintList.findIndex(p => p.id === targetId);
  if (srcRealIdx === -1 || targetRealIdx === -1) return;
  const [moved] = spvMaintList.splice(srcRealIdx, 1);
  spvMaintList.splice(targetRealIdx, 0, moved);
  spvMaintList.forEach((p, i) => { p.sortOrder = i + 1; });
  spvMaintDragSrc = null;
  saveSpvMaintList();
  renderSpvMaintPage();
}
function onSpvMaintDragEnd(e) {
  e.target.closest('tr').style.opacity = '';
  document.querySelectorAll('#spvMaintContent .product-maint-table tbody tr').forEach(tr => tr.classList.remove('drag-over'));
  spvMaintDragSrc = null;
}

function showAddSpvModal() {
  const modal = document.getElementById('addSpvModal');
  document.getElementById('newSpvCode').value = '';
  document.getElementById('newSpvName').value = '';
  document.getElementById('newSpvShortName').value = '';
  document.getElementById('newSpvTval').value = 'T+0';
  document.getElementById('newSpvNature').value = '债券专户';
  document.getElementById('newSpvSortOrder').value = '';
  document.getElementById('addSpvHint').style.display = 'none';
  modal.classList.add('show');
  setTimeout(() => document.getElementById('newSpvCode').focus(), 50);
}

function closeAddSpvModal() {
  document.getElementById('addSpvModal').classList.remove('show');
}

function confirmAddSpv() {
  const code = (document.getElementById('newSpvCode').value || '').trim();
  const name = (document.getElementById('newSpvName').value || '').trim();
  const tVal = document.getElementById('newSpvTval').value;
  const nature = document.getElementById('newSpvNature').value;
  const shortName = document.getElementById('newSpvShortName').value.trim() || name;
  const hint = document.getElementById('addSpvHint');
  if (!code) { hint.textContent = '请输入专户代码'; hint.style.display = 'block'; return; }
  if (!name) { hint.textContent = '请输入专户名称'; hint.style.display = 'block'; return; }
  if (spvMaintList.some(p => { const a = allAccounts.find(ac => ac.id === p.id); return a && a.code === code; })) {
    hint.textContent = '专户代码已存在'; hint.style.display = 'block'; return;
  }
  const sortVal = parseInt(document.getElementById('newSpvSortOrder').value) || spvMaintList.length + 1;
  const newId = 'spv_' + Date.now();
  spvMaintList.push({ id: newId, online: true, terminated: false, sortOrder: sortVal, tVal, nature, shortName });
  allAccounts.push({ id: newId, code, name, shortName, tVal, nature, totalBP: 0, accountSize: 0, holdings: [] });
  spvMaintList.sort((a, b) => a.sortOrder - b.sortOrder);
  saveSpvMaintList();
  closeAddSpvModal();
  renderSpvMaintPage();
}

// 创建默认头寸数据行（新增产品无初始数据时使用）
function createDefaultPositionRow(code, name) {
  return {
    code: code,
    name: name,
    date: new Date().toISOString().slice(0, 10),
    dayBegin: 0,
    subAll: 0,
    redAll: 0,
    fee: 0,
    t1Back: 0,
    bankExch: 0
  };
}

let positionSpvModalData = null; // 当前打开的专户弹窗数据

function renderPositionPage() {
  try {
  // 视图数据源：当日=positionData（实时）；历史=按日期重建的快照
  const histMode = isHistoryMode();
  const viewData = histMode ? buildHistoryPositionData(positionViewDate) : positionData;
  _positionViewData = viewData;
  // 计算所有行
  viewData.forEach(row => calcPositionRow(row));

  // 过滤：上线产品 ∪ 当天有调仓数据的产品 + 搜索过滤
  const onlineCodes = new Set(getOnlineProducts().map(p => p.code));
  const q = positionFilter.trim().toLowerCase();
  const allFiltered = viewData.filter(row => {
    if (!onlineCodes.has(row.code) && !hasRebalanceData(row)) return false;
    if (!q) return true;
    return row.code.toLowerCase().includes(q) || row.name.toLowerCase().includes(q);
  });

  // 统计各状态数量（基于搜索过滤后的全集，两态：已平衡/待整理）
  const totalCount = allFiltered.length;
  const allStatuses = allFiltered.map(r => calcAutoStatus(r));
  const balancedCount = allStatuses.filter(s => s === 'balanced').length;
  const pendingCount = allStatuses.filter(s => s === 'pending').length;

  // 状态筛选
  let filtered = allFiltered;
  if (positionStatusFilter === 'pending') {
    filtered = allFiltered.filter(r => calcAutoStatus(r) === 'pending');
  } else if (positionStatusFilter === 'balanced') {
    filtered = allFiltered.filter(r => calcAutoStatus(r) === 'balanced');
  }
  // 调仓带入产品置顶：临时产品（不在维护清单、当日有调仓数据）集中排最前，便于一眼看到本次同步结果
  // （排序稳定，非临时产品保持原有顺序；不用分组标题行，避免与后续可能的表头排序冲突）
  filtered = [...filtered].sort((a, b) => {
    const ta = (!onlineCodes.has(a.code) && hasRebalanceData(a)) ? 1 : 0;
    const tb = (!onlineCodes.has(b.code) && hasRebalanceData(b)) ? 1 : 0;
    return tb - ta;
  });

  const container = document.getElementById('positionContent');
  // 历史查看模式：给容器挂类名，隐藏上传等实时操作
  container.classList.toggle('pos-history-mode', histMode);

  // 构建表头（两层：固定列 rowspan=2，专户列 colspan=2）
  let headerRow1 = '', headerRow2 = '';
  positionColumns.forEach(col => {
    if (!visibleColumns[col.key]) return;
    const purpleClass = col.isPurple ? ' style="background:#EDE9FE;"' : '';
    headerRow1 += `<th${purpleClass} rowspan="2">${col.label}</th>`;
  });
  // 专户列：每个专户 colspan=2（分页展示）
  const spvPage = getSpvPage();
  spvPage.forEach(spv => {
    // 已下线/已清仓专户：列头追加状态标（灰底弱化），提示该列数据来自非在线专户
    const spvStatusTag = spv._offline
      ? `<span class="spv-offline-tag" title="该专户在「专户产品维护」中${spv._spvStatusLabel || '已下线'}，因当日仍有专户调仓数据临时展示，待残留持仓出清后自动隐藏">${spv._spvStatusLabel || '已下线'}</span>`
      : '';
    // 临时专户：不在「专户产品维护」清单，因当日有本专户调仓数据临时展示（置顶于专户区第一列）
    const isTempSpv = isTempSpvCol(spv);
    const spvTempTag = isTempSpv
      ? `<span class="spv-temp-tag" title="${spv._tempReason || '该专户不在「专户产品维护」清单，因当日有本专户的调仓数据临时展示，待维护确认，或无待处理调仓事项后退出临时展示（历史记录保留）'}">临时</span>`
      : '';
    const spvColCls = spv._offline ? ' spv-offline-col' : (isTempSpv ? ' spv-temp-col' : '');
    headerRow1 += `<th class="spv-group-header${spvColCls}" colspan="2"><span class="spv-name">${spv.name}</span>${spvTempTag}${spvStatusTag}</th>`;
    headerRow2 += `<th class="spv-sub-col">申购金额</th><th class="spv-red-col">赎回金额</th>`;
  });

  // 头寸状态标签HTML（基于自动判定，两态）
  // 「已平衡」是头寸申赎轧差的资金计算状态，不代表交易完成 —— 通过 tooltip 说明，避免与调仓同步混淆
  function posStatusTag(autoStatus) {
    if (autoStatus === 'balanced') return '<span class="pos-status-tag balanced" title="当日头寸申赎轧差为 0 的资金计算状态，不代表交易完成；交易以实际清算结果为准">已平衡 ✓</span>';
    return '<span class="pos-status-tag pending">待整理 ⚠️</span>';
  }

  // 构建表体
  let bodyHTML = '';
  filtered.forEach((row, idx) => {
    const autoStatus = calcAutoStatus(row);
    const isBalanced = autoStatus === 'balanced';
    const isPending = autoStatus === 'pending';
    // 临时产品：不在产品维护上线清单，仅因当日有调仓数据临时展示
    const isTempProduct = !onlineCodes.has(row.code) && hasRebalanceData(row);
    // 该产品当日有调仓数据（已同步写入头寸表）
    const hasRebalance = hasRebalanceData(row);
    let rowClass = '';
    if (isTempProduct) rowClass = ' class="temp-product-row"';           // 临时产品行：浅琥珀底色（优先于已平衡灰底，避免删除线干扰辨识）
    else if (isBalanced) rowClass = ' class="confirmed-row"';
    else if (isPending) rowClass = ' class="warn-row"';

    let cellsHTML = '';
    positionColumns.forEach(col => {
      if (!visibleColumns[col.key]) return;
      const val = row[col.key];

      if (col.key === 'code') {
        cellsHTML += `<td style="font-weight:500;"><a class="product-link" href="#" onclick="event.preventDefault();openProductInfoModal('${val}','${escHtml(row.name)}');">${val}</a></td>`;
      } else if (col.key === 'name') {
        const tempBadge = isTempProduct ? '<span class="temp-product-tag" title="该产品不在理财产品维护清单，因当日有调仓数据临时展示；无待处理调仓事项后退出临时展示，历史记录保留">临时</span>' : '';
        cellsHTML += `<td style="white-space:nowrap;" title="${val}"><a class="product-link pos-name-link" href="#" onclick="event.preventDefault();openProductInfoModal('${row.code}','${escHtml(row.name)}');">${val}</a>${tempBadge}</td>`;
      } else if (col.key === 'posStatus') {
        // 当日有调仓数据的产品加「调仓已同步」标记，与「已平衡」（资金计算状态）明确区分
        const rebTag = hasRebalance ? '<span class="pos-rebalance-tag" title="该产品当日有调仓数据，已同步写入头寸表；「已平衡」为头寸申赎轧差的资金计算状态，不代表交易完成">调仓已同步</span>' : '';
        cellsHTML += `<td class="pos-status-cell">${posStatusTag(autoStatus)}${rebTag}</td>`;
      } else if (col.isNum) {
        // 活期字段：不计算活期的产品显示特殊标记
        if ((col.key === 'needLiveAmt' || col.key === 'needTakeLiveAmt') && !shouldCalcCurrent(row.code)) {
          cellsHTML += `<td class="num"><span class="tag-live-skip" title="该产品不计算活期存取">不适用</span></td>`;
        } else if (val == null) {
          cellsHTML += `<td class="num" style="color:var(--text-muted);">--</td>`;
        } else {
          const colorClass = val > 0 ? 'pos' : (val < 0 ? 'neg' : '');
          cellsHTML += `<td class="num ${colorClass}">${fmtMoney(val)}</td>`;
        }
      } else {
        cellsHTML += `<td>${val || '--'}</td>`;
      }
    });
    // 专户列
    spvPage.forEach(spv => {
      const sd = (row._spv && row._spv[spv.id]) ? row._spv[spv.id] : { sub: null, red: null };
      const subManual = sd.subManual || 0;
      const subRebalance = sd.subRebalance || 0;
      const redManual = sd.redManual || 0;
      const redRebalance = sd.redRebalance || 0;
      const makeSubTitle = () => {
        if (!subManual && !subRebalance) return '';
        let t = '';
        if (subManual) t += '手动调整: ' + fmtMoneyNeg(subManual);
        if (subRebalance) t += (t ? '\n' : '') + '专户调仓: ' + fmtMoneyNeg(-subRebalance);
        return t;
      };
      const makeRedTitle = () => {
        if (!redManual && !redRebalance) return '';
        let t = '';
        if (redManual) t += '手动调整: ' + fmtMoneyPos(redManual);
        if (redRebalance) t += (t ? '\n' : '') + '专户调仓: ' + fmtMoneyPos(redRebalance);
        return t;
      };
      // 申购金额
      if (sd.sub != null) {
        const subTitle = makeSubTitle();
        cellsHTML += `<td class="num"><span class="clickable-amount" onclick="openPositionSpvModal('${row.code}','${spv.id}','sub')"${subTitle ? ' title="' + subTitle + '"' : ''}>${fmtMoneyNeg(sd.sub)}</span>${subRebalance ? ' <sup style="font-size:9px;color:#2563EB;">调仓</sup>' : ''}</td>`;
      } else {
        cellsHTML += `<td class="num" style="color:var(--text-muted);">--</td>`;
      }
      // 赎回金额
      if (sd.red != null) {
        const redTitle = makeRedTitle();
        cellsHTML += `<td class="num"><span class="clickable-amount" onclick="openPositionSpvModal('${row.code}','${spv.id}','red')"${redTitle ? ' title="' + redTitle + '"' : ''}>${fmtMoneyPos(sd.red)}</span>${redRebalance ? ' <sup style="font-size:9px;color:#2563EB;">调仓</sup>' : ''}</td>`;
      } else {
        cellsHTML += `<td class="num" style="color:var(--text-muted);">--</td>`;
      }
    });

    bodyHTML += `<tr${rowClass} data-code="${row.code}">${cellsHTML}</tr>`;
  });

  // 汇总
  let totalSubAll = 0, totalRedAll = 0, totalFee = 0, totalT1 = 0, totalBankExch = 0;
  let totalSrSum = 0, totalBeforeMod = 0;
  let spvTotals = {}; // { spvId: { sub: 0, red: 0 } }
  spvPage.forEach(spv => { spvTotals[spv.id] = { sub: 0, red: 0 }; });
  filtered.forEach(row => {
    totalSubAll += row.subAll;
    totalRedAll += row.redAll;
    totalFee += row.fee;
    totalT1 += row.t1Back;
    totalBankExch += row.bankExch;
    totalSrSum += row.srSum;
    totalBeforeMod += (row.beforeMod || 0);
    if (row._spv) {
      spvPage.forEach(spv => {
        if (row._spv[spv.id]) {
          spvTotals[spv.id].sub += (row._spv[spv.id].sub || 0);
          spvTotals[spv.id].red += (row._spv[spv.id].red || 0);
        }
      });
    }
  });

  // 列切换按钮（固定列 + 专户列），alwaysShow列不生成切换按钮
  let toggleBtnsHTML = '';
  positionColumns.forEach(col => {
    if (col.alwaysShow) return;
    const cls = visibleColumns[col.key] ? 'show' : 'hide';
    toggleBtnsHTML += `<button class="col-toggle-btn ${cls}" onclick="toggleColumn('${col.key}')">${col.label}</button>`;
  });

  // 构建汇总行的专户列单元格
  let summarySpvCells = '';
  spvPage.forEach(spv => {
    const t = spvTotals[spv.id];
    summarySpvCells += `<td class="num">${t.sub !== 0 ? fmtMoneyNeg(t.sub) : '<span style="color:var(--text-muted);">--</span>'}</td>`;
    summarySpvCells += `<td class="num">${t.red !== 0 ? fmtMoneyPos(t.red) : '<span style="color:var(--text-muted);">--</span>'}</td>`;
  });

  // 构建汇总行的固定列单元格
  let summaryFixedCells = '';
  positionColumns.forEach(col => {
    if (!visibleColumns[col.key]) return;
    summaryFixedCells += '<td class="num" style="font-weight:600;"></td>';
  });

  // 进度百分比：已平衡占比
  const progressPct = totalCount > 0 ? Math.round(balancedCount / totalCount * 100) : 0;

  // 状态筛选按钮
  const sf = positionStatusFilter;
  const filterBtns = `
    <div class="status-filter-group">
      <button class="status-filter-btn ${sf==='all'?'active':''}" onclick="setPositionStatusFilter('all')">全部<span class="filter-count">${totalCount}</span></button>
      <button class="status-filter-btn ${sf==='pending'?'active':''}" onclick="setPositionStatusFilter('pending')">待整理<span class="filter-count">${pendingCount}</span></button>
      <button class="status-filter-btn ${sf==='balanced'?'active':''}" onclick="setPositionStatusFilter('balanced')">已平衡<span class="filter-count">${balancedCount}</span></button>
    </div>
  `;

  container.innerHTML = `
    <!-- 顶部操作栏 -->
    <div class="position-toolbar">
      <div class="position-toolbar-left">
        <button class="toolbar-btn primary upload-zone-hide" onclick="alert('Demo: 上传日初头寸文件')">
          <span>⬆️</span> 上传日初头寸
        </button>
        <button class="toolbar-btn success upload-zone-hide" onclick="alert('Demo: 上传SPV持仓文件')">
          <span>⬆️</span> 上传SPV持仓
        </button>
        <button class="toolbar-btn upload-zone-hide" onclick="alert('Demo: 上传银行交易所数据文件')" style="background:#6366F1;color:#fff;">
          <span>⬆️</span> 上传银行交易所数据
        </button>
        <div class="toolbar-info">
          <span>最新上传日初头寸日期：<strong style="color:${isPositionFresh() ? 'var(--success)' : '#C2410C'};">${positionDataDate}${isPositionFresh() ? ' ✓今日' : '（非今日）'}</strong></span>
          <span>上传SPV持仓日期：<strong>2026-06-04</strong></span>
          <span>交易所账户：<strong style="color:var(--success);">已配置 ✓</strong></span>
        </div>
      </div>
      <div class="position-toolbar-right">
        <!-- 头寸日期选择器：可查看历史某一天的头寸页面 -->
        <div class="pos-date-picker">
          <label>头寸日期</label>
          <input type="date" value="${positionViewDate}" max="${POSITION_TODAY}"
                 title="选择日期查看该日头寸"
                 onchange="setPositionViewDate(this.value)">
        </div>
        <button class="toolbar-btn warning" onclick="exportPositionData()">
          <span>⬇️</span> 导出数据
        </button>
        <button class="toolbar-collapse-btn upload-zone-hide" onclick="toggleUploadArea()" title="收起/展开上传区">
          ${uploadAreaExpanded ? '▲ 收起' : '▼ 展开'}
        </button>
      </div>
    </div>

    <!-- 历史查看提示条 -->
    ${histMode ? `
    <div class="pos-history-banner">
      <span class="hb-tag">历史查看</span>
      <span>当前展示 <span class="hb-strong">${positionViewDate}</span> 的头寸快照，数据为<span class="hb-strong">只读</span>状态，不可编辑/上传/导出。</span>
      <button class="hb-back" onclick="resetPositionViewDate()">返回最新头寸</button>
    </div>` : ''}

    <!-- 信息提示条（可收缩） -->
    ${(uploadAreaExpanded && !histMode) ? `
    <div class="info-tip-bar">
      <span class="tip-num">1</span>
      <span>点击上方按钮选择文件上传；2. 支持文件拖拽上传，依次拖入文件： SPV持仓 → 日初头寸 → 银行交易所数据</span>
    </div>` : ''}

    <!-- 进度 + 筛选（同一行） -->
    <div class="position-progress-bar">
      <span class="progress-text">整理进度：<strong>${balancedCount}</strong> / ${totalCount} 只</span>
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%;"></div></div>
      <span class="progress-text">待整理 <strong style="color:#9A3412;">${pendingCount}</strong> 只</span>
      ${pendingCount > 0 ? `<button class="jump-btn" onclick="jumpToNextPending()">⏭ 跳转下一个待整理</button>` : ''}
      <div style="flex:1;"></div>
      ${filterBtns}
    </div>

    <!-- 字段控制 + 搜索 + 专户分页 + 列切换（同一行，可随上传区一起收缩） -->
    ${uploadAreaExpanded ? `
    <div class="filter-bar" style="margin-top:0;">
      <button class="expand-fields-btn" onclick="toggleAllColumns()">展示所有字段</button>
      <span style="font-size:12px;color:var(--text-muted);">共计 <strong style="color:var(--text);">${totalCount}</strong> 个理财产品${(() => {
        // 调仓带入产品数：不在维护清单、当日有调仓数据的临时产品（已置顶展示）
        const tempProductCnt = allFiltered.filter(r => !onlineCodes.has(r.code) && hasRebalanceData(r)).length;
        return tempProductCnt > 0 ? `<span style="color:#9A3412;" title="含不在理财产品维护清单、因当日有调仓数据临时展示的产品，已置顶">(含${tempProductCnt}个调仓带入)</span>` : '';

// 判断产品当天是否有专户调仓数据（_spv 中任一专户有 subRebalance/redRebalance）
function hasRebalanceData(row) {
  if (!row._spv) return false;
  return Object.values(row._spv).some(sd => (sd.subRebalance || 0) !== 0 || (sd.redRebalance || 0) !== 0);
}

// 跳转到下一个待整理产品
function jumpToNextPending() {
  if (isHistoryMode()) { alert('历史查看模式下不可操作，请先返回最新头寸。'); return; }
  const onlineCodes = new Set(getOnlineProducts().map(p => p.code));
  const q = positionFilter.trim().toLowerCase();
  const pending = positionData.filter(row => {
    if (!onlineCodes.has(row.code) && !hasRebalanceData(row)) return false;
    if (calcAutoStatus(row) !== 'pending') return false;
    if (!q) return true;
    return row.code.toLowerCase().includes(q) || row.name.toLowerCase().includes(q);
  });
  if (pending.length === 0) {
    alert('没有待整理的产品了，全部已平衡！');
    return;
  }
  // 找到第一个待整理产品在表格中的行
  const targetCode = pending[0].code;
  const tbody = document.querySelector('.position-table tbody');
  if (tbody) {
    const rows = tbody.querySelectorAll('tr[data-code]');
    for (const tr of rows) {
      if (tr.dataset.code === targetCode) {
        tr.scrollIntoView({ behavior: 'smooth', block: 'center' });
        // 醒目高亮：脉冲闪烁三次
        tr.style.transition = 'background 0.15s, transform 0.15s';
        const origBg = tr.style.background;
        let flashes = 0;
        const flash = () => {
          if (flashes >= 3) {
            tr.style.background = origBg;
            tr.style.outline = '';
            tr.style.transform = '';
            return;
          }
          const on = flashes % 2 === 0;
          tr.style.background = on ? '#FEF3C7' : origBg;
          tr.style.outline = on ? '3px solid #F59E0B' : '';
          tr.style.transform = on ? 'scale(1.01)' : '';
          tr.style.zIndex = on ? '5' : '';
          tr.style.position = on ? 'relative' : '';
          flashes++;
          setTimeout(flash, 350);
        };
        flash();
        break;
      }
    }
  }
}

function toggleAllColumns() {
  // 切换所有列的显示/隐藏（alwaysShow列不受影响，专户列不受影响）
  const toggleableCols = positionColumns.filter(c => !c.alwaysShow);
  const allVisible = toggleableCols.every(c => visibleColumns[c.key]);
  toggleableCols.forEach(c => {
    visibleColumns[c.key] = !allVisible;
  });
  // 确保alwaysShow列始终可见
  positionColumns.forEach(c => { if (c.alwaysShow) visibleColumns[c.key] = true; });
  renderPositionPage();
}

function toggleColumn(key) {
  // alwaysShow列不允许切换
  const col = positionColumns.find(c => c.key === key);
  if (col && col.alwaysShow) return;
  visibleColumns[key] = !visibleColumns[key];
  renderPositionPage();
}

// 计算产品级一键平头寸 gap
// gap = |总申购款| - |专户总申购款(T+0)| + |专户总赎回款(T+0)| - |总赎回款|
function calcHeadroomGap(product) {
  const totalSub = Math.abs(product.totalSub || 0);
  const totalRed = Math.abs(product.totalRed || 0);

  // 汇总所有 T+0 专户的申购/赎回
  let t0SubSum = 0, t0RedSum = 0;
  if (product._spv) {
    Object.keys(product._spv).forEach(sid => {
      // 判断是否 T+0
      const spvItem = spvMaintList.find(s => s.id === sid);
      const isT0 = spvItem ? spvItem.tVal === 'T+0' : true;
      if (!isT0) return;
      const sd = product._spv[sid] || {};
      // 剔除专户调仓/拉壳带入的金额，只统计自然申赎（手动维护部分）
      // 徽章用「其中」语义锁定口径A：主金额包含调仓 → gap 必须剔除调仓，否则一键平头寸会少算
      const naturalSub = Math.abs(sd.sub || 0) - Math.abs(sd.subRebalance || 0);
      const naturalRed = Math.abs(sd.red || 0) - Math.abs(sd.redRebalance || 0);
      t0SubSum += naturalSub;
      t0RedSum += naturalRed;
    });
  }
  return totalSub - t0SubSum + t0RedSum - totalRed;
}

// 一键平头寸（申购）
function fillSubHeadroom(productCode, spvId) {
  const product = positionData.find(p => p.code === productCode);
  if (!product) return;
  const gap = calcHeadroomGap(product);
  const subInput = document.getElementById('spvSubInput');
  if (subInput && gap > 0) {
    subInput.value = gap.toLocaleString('zh-CN');
    onSpvSubInput();
  } else {

function closeSpvAmountModal(e) {

  if (modal) modal.remove();
}

function saveSpvAmount(productCode, spvId) {
  if (isHistoryMode()) { alert('历史查看模式下数据只读，请先返回最新头寸。'); return; }
  const subInput = document.getElementById('spvSubInput');
  const redInput = document.getElementById('spvRedInput');
  const subMoney = getMoneyInputAmount(subInput ? subInput.value : '');
  const redMoney = getMoneyInputAmount(redInput ? redInput.value : '');
  const subVal = subMoney.amount;
  const redVal = redMoney.amount;

  const product = positionData.find(p => p.code === productCode);
  if (!product) return;

  // 持仓份额校验：赎回份额 > 当前持仓时拦截
  if (!isNaN(redVal) && redVal > 0) {
    const spvHoldings = getSPVData(productCode);
    const spvHolding = spvHoldings.find(h => h.spvCode === spvId || h.spvName === spvId) || spvHoldings[0];
    if (spvHolding) {
      const nav = spvHolding.nav || 1;
      const qty = spvHolding.qty || 0;
      const estRedQty = Math.round(redVal / nav);
      if (estRedQty > qty) {
        alert('赎回份额校验不通过！\n\n申请赎回份额：' + estRedQty.toLocaleString('zh-CN') + ' 份\n当前专户持仓：' + qty.toLocaleString('zh-CN') + ' 份\n\n请调整赎回金额后重试。');
        return;
      }
    }
  }

  // —— 软拦截：含专户调仓金额的手工修改保护（一申配一赎配对完整性）——
  // 该单元格存在调仓带入金额（subRebalance/redRebalance ≠ 0）且金额被改动时，
  // 弹确认框告知后果；坚持保存则清除调仓标记，保证「显示金额」与「调仓标记」永远一致。
  const sd0 = (product._spv && product._spv[spvId]) || {};
  const hasReb = Math.abs(sd0.subRebalance || 0) > 0 || Math.abs(sd0.redRebalance || 0) > 0;
  if (hasReb) {
    const newSub = (!isNaN(subVal) && subVal > 0) ? subVal : 0;
    const newRed = (!isNaN(redVal) && redVal > 0) ? redVal : 0;
    const oldSub = Math.abs(sd0.sub || 0);
    const oldRed = sd0.red || 0;
    if (newSub !== oldSub || newRed !== oldRed) {
      showRebOverwriteModal(productCode, spvId, newSub, newRed);
      return; // 拦截，等待确认框结果；取消则不落库
    }
  }

  doSaveSpvAmount(productCode, spvId, subVal, redVal, false);
}

// 落库：写入金额并维护 subManual/redManual 留痕；clearReb=true 时清除调仓标记
// 符号约定（与 confirmSync / 模拟数据生成一致）：
//   sub / subManual = 负数（或 null/0）；subRebalance = 正数；red 三者均为正数
//   合并公式：sub = subManual - subRebalance；red = redManual + redRebalance
function doSaveSpvAmount(productCode, spvId, subVal, redVal, clearReb) {
  const product = positionData.find(p => p.code === productCode);
  if (!product) return;

  if (!product._spv) product._spv = {};
  if (!product._spv[spvId]) product._spv[spvId] = { sub: null, red: null, subManual: 0, subRebalance: 0, redManual: 0, redRebalance: 0 };

  const s = product._spv[spvId];
  const mSub = (!isNaN(subVal) && subVal > 0) ? subVal : 0;
  const mRed = (!isNaN(redVal) && redVal > 0) ? redVal : 0;

  // 标记为手工编辑：calcPositionRow 不再用模拟数据覆盖该单元格
  s._edited = true;

  s.subManual = -mSub;
  s.redManual = mRed;
  if (clearReb) {
    s.subRebalance = 0;
    s.redRebalance = 0;
  }

  // 申购金额为负（表示支出）
  s.sub = mSub > 0 ? -mSub : null;
  // 赎回金额为正
  s.red = mRed > 0 ? mRed : null;

  if (clearReb) {
    showToast('已保存当前金额，配套交易未调整；当前金额已转为人工录入。');
  }

  closeSpvAmountModal();
  renderPositionPage();
}

// —— 调仓金额改写确认框（叠在金额弹窗之上，z-index 1001 > .modal-overlay 999）——
let pendingRebOverwrite = null;

function showRebOverwriteModal(productCode, spvId, newSub, newRed) {
  const product = positionData.find(p => p.code === productCode);
  const spv = getPositionSpvColumns().find(s => s.id === spvId);
  if (!product || !spv) { doSaveSpvAmount(productCode, spvId, newSub, newRed, false); return; }
  const sd = (product._spv && product._spv[spvId]) || {};
  const subReb = Math.abs(sd.subRebalance || 0);
  const redReb = Math.abs(sd.redRebalance || 0);
  pendingRebOverwrite = { productCode, spvId, newSub, newRed };

  const modalHTML = `
    <div class="modal-overlay show" id="rebOverwriteModal" style="z-index:1001;" onclick="closeRebOverwriteModal(event)">
      <div class="modal" style="width:540px;max-width:92vw;" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>修改含专户调仓金额</h3>
          <button class="modal-close" onclick="closeRebOverwriteModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="info-line"><span class="info-label">专户</span><span class="info-value">${spv.name}</span></div>
          <div class="info-line"><span class="info-label">理财产品</span><span class="info-value">${product.code} ${product.name}</span></div>
          <div style="margin-top:12px;padding:10px 12px;background:#FFFBEB;border:1px solid #FCD34D;border-radius:6px;color:#92400E;font-size:13px;line-height:1.8;">
            该金额包含调仓${[subReb ? '申购 ' + fmtMoney(subReb) + ' 元' : '', redReb ? '赎回 ' + fmtMoney(redReb) + ' 元' : ''].filter(Boolean).join('、')}。<br><br>
            继续保存将仅修改当前金额，配套${subReb && !redReb ? '赎回' : redReb && !subReb ? '申购' : '交易'}金额不会改变，可能产生差额；当前金额的「调仓」标记将移除，原调仓不会撤销。<br><br>
            <b>建议返回「专户调仓」调整后重新同步。</b>
          </div>
        </div>
        <div class="modal-footer">
          <button class="spv-btn-cancel" onclick="closeRebOverwriteModal()">取消</button>
          <button class="spv-btn-confirm" onclick="confirmRebOverwrite()">仍要修改并保存</button>
        </div>
      </div>
    </div>`;

  const old = document.getElementById('rebOverwriteModal');
  if (old) old.remove();
  document.body.insertAdjacentHTML('beforeend', modalHTML);
}

function closeRebOverwriteModal(e) {
  if (e && e.target !== document.getElementById('rebOverwriteModal')) return;
  const modal = document.getElementById('rebOverwriteModal');
  if (modal) modal.remove();
  pendingRebOverwrite = null;
}

function confirmRebOverwrite() {
  if (!pendingRebOverwrite) return;
  const { productCode, spvId, newSub, newRed } = pendingRebOverwrite;
  const modal = document.getElementById('rebOverwriteModal');
  if (modal) modal.remove();
  pendingRebOverwrite = null;
  doSaveSpvAmount(productCode, spvId, newSub, newRed, true);
}

// 金额智能单位提示：仅保留 元 / 万元 / 亿元 三级（已去掉「千」档）
// >=1亿 → 亿元；>=1万 → 万元；否则 → 元（整数，不带小数）
function fmtWanYuan(v) {
  if (v == null || isNaN(v)) return '';
  const abs = Math.abs(v);
  if (abs >= 100000000) {
    return (v / 100000000).toFixed(2) + '亿元';
  } else if (abs >= 10000) {
    return (v / 10000).toFixed(2) + '万元';
  }
  return Math.round(v).toLocaleString('zh-CN') + '元';
}

function fmtMoney(v) {
  if (v == null || isNaN(v)) return '--';
  return v.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function fmtMoneyNeg(v) {
  // 申购内部按负数参与计算，页面按生产系统口径展示绝对金额。
  if (v == null || isNaN(v)) return '--';
  return Math.abs(v).toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function fmtMoneyPos(v) {
  // 赎回内部按正数参与计算，页面按生产系统口径展示绝对金额。
  if (v == null || isNaN(v)) return '--';
  return Math.abs(v).toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ==================== 产品搜索添加 ====================
// 候选来源：「SPV持仓查询」页数据（positionData），不再使用独立产品库
// 已下线产品排除；未维护产品可添加（标注“临时”）；规模带出持有专户总规模（元）

function getAddableProducts() {
  return positionData
    .map(p => {
      const m = productMaintList.find(x => x.code === p.code);
      const status = (m && m.online) ? 'online' : (m && !m.online) ? 'offline' : 'unmaint';
      const holdings = getSPVData(p.code);
      const totalScale = holdings.reduce((sum, h) => sum + (h.scale || (h.qty * h.nav) || 0), 0);
      return { code: p.code, name: p.name, status, totalScale, spvCount: holdings.length };
    })
    .filter(p => p.status !== 'offline');
}
function getAddProductEmptyText(query, existingCodes, options = {}) {
  const q = (query || '').trim().toLowerCase();
  const matches = positionData.filter(p => p.code.toLowerCase().includes(q) || p.name.toLowerCase().includes(q));
  if (matches.length === 0) return '该理财产品不在当日SPV持仓中，不可添加';
  const offlineMatches = matches.filter(p => {
    const m = productMaintList.find(x => x.code === p.code);
    return m && !m.online;
  });
  if (offlineMatches.length > 0 && offlineMatches.length === matches.length) return '该理财产品已下线，不可作为新增申购目标';

  const onlineMatches = matches.filter(p => {
    const m = productMaintList.find(x => x.code === p.code);
    return !(m && !m.online);
  });
  const holdingCodes = options.holdingCodes || new Set();
  const extraCodes = options.extraCodes || new Set();
  const exactMatch = onlineMatches.find(p => p.code.toLowerCase() === q);
  if (exactMatch && holdingCodes.has(exactMatch.code)) {
    return '该理财产品已在本专户持仓中，不能作为右侧新增申购产品';
  }
  if (exactMatch && extraCodes.has(exactMatch.code)) {
    return '该理财产品已在右侧申购列表中';
  }
  if (existingCodes && onlineMatches.length > 0 && onlineMatches.every(p => existingCodes.has(p.code))) {
    return '未找到可添加的理财产品，请输入更完整的产品代码或名称';
  }
  return '未找到可添加的理财产品，请更换代码或名称重试';
}
function onProductSearch(query) {
  const dropdown = document.getElementById('productSearchDropdown');
  const input = document.getElementById('productSearchInput');
  if (!query || query.trim().length < 1) {
    dropdown.style.display = 'none';
    return;
  }
  const q = query.trim().toLowerCase();
  const results = getAddableProducts().filter(p =>
    p.code.toLowerCase().includes(q) || p.name.toLowerCase().includes(q)
  ).slice(0, 8);

  if (results.length === 0) {
    dropdown.innerHTML = '<div style="padding:8px 12px;font-size:12px;color:var(--text-muted);">' + getAddProductEmptyText(q) + '</div>';
  } else {
    dropdown.innerHTML = results.map(p => {
      const badge = p.status === 'unmaint'
        ? '<span style="font-size:10px;padding:1px 5px;border-radius:3px;background:#FEF3C7;color:#B45309;">临时</span>'
        : '';
      const sizeYi = (p.totalScale / 100000000).toFixed(2);
      return `
      <div onclick="addProductFromSearch('${p.code}')" style="padding:8px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;gap:6px;">
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><strong>${p.code}</strong> ${p.name.split('（')[0].split('(')[0]} ${badge}</span>
        <span style="font-size:10px;color:var(--text-muted);white-space:nowrap;">${sizeYi}亿</span>
      </div>`;
    }).join('');
  }
  dropdown.style.display = 'block';
}

function addProductFromSearch(code) {
  const prod = positionData.find(p => p.code === code);
  if (!prod) return;

  const acc = getAccount(currentAccountId);
  const st = getState(currentAccountId);
  if (!acc || !st) return;

  // 检查是否已存在
  const exists = acc.holdings.find(p => p.code === code);
  if (exists) {
    alert('产品 ' + code + ' 已在本专户持仓列表中，无需重复添加');
    return;
  }

  // 规模带出口径：SPV持仓查询页该产品持有专户总规模（Σ 各专户持仓市值，元）
  const holdings = getSPVData(code);
  const totalScale = holdings.reduce((sum, h) => sum + (h.scale || (h.qty * h.nav) || 0), 0);

  // 添加新产品（默认未选中，BP=0，规模来自持仓查询）
  acc.holdings.push({
    code: prod.code,
    name: prod.name,
    size: Math.round(totalScale),
    defaultBP: 0,
    defaultSelected: false,
    feeRatio: 1.0033613,
  });
  st.bpData[prod.code] = 0;

  // 关闭下拉
  document.getElementById('productSearchDropdown').style.display = 'none';
  document.getElementById('productSearchInput').value = '';
  renderContent(acc, st);
  recalcCurrent();
  // 若选择弹窗打开中，同步刷新其列表状态
  if (document.getElementById('addChannelProductModal').classList.contains('show')) {
    renderChannelProductPicker();
  }
}

// ==================== 申购端「非持仓产品」添加（2026-09-09 放开申购端候选池）====================
// 业务背景：经客户确认，申购端可不限制必须持有当前专户——申购即代表"进入"该专户，是否预先持仓不影响申购能力。
// 例如：投资经理临时决定让某理财产品新建仓持有本专户，调仓页面应支持录入这笔申购。
// 添加的产品仅进入申购端候选池（st.subExtraProducts），不动左栏、不影响赎回端。

function onSubExtraSearch(query) {
  if (isAdjustHistoryMode()) return;
  const dropdown = document.getElementById('subExtraSearchDropdown');
  const input = document.getElementById('subExtraSearchInput');

  const acc = getAccount(currentAccountId);
  const st = getState(currentAccountId);
  if (!acc || !st) return;

  // 候选 = SPV 持仓查询页产品（已下线产品自动排除），且不在本专户持仓中、也不在已添加的额外产品中
  const holdingCodes = new Set(acc.holdings.map(p => p.code));
  const extraCodes = new Set((st.subExtraProducts || []).map(p => p.code));
  const existing = new Set([...holdingCodes, ...extraCodes]);
  const addable = getAddableProducts().filter(p => !existing.has(p.code));

  const q = (query || '').trim().toLowerCase();
  // 无关键字 → 展示空白列表（提示用户输入关键字筛选）
  if (!q) {
    dropdown.innerHTML = '<div style="padding:10px 12px;font-size:12px;color:var(--text-muted);text-align:center;">输入产品代码或名称关键字筛选（可申购未持有本专户的理财产品）</div>';
    dropdown.style.display = 'block';
    const rect = input.getBoundingClientRect();
    // fixed 定位直接用视口坐标（脱离 .loss-panel-body 的 overflow 裁剪链）
    dropdown.style.top = (rect.bottom + 2) + 'px';
    dropdown.style.left = rect.left + 'px';
    return;
  }

  const results = addable.filter(p =>
    p.code.toLowerCase().includes(q) || p.name.toLowerCase().includes(q)
  ).slice(0, 8);

  if (results.length === 0) {
    dropdown.innerHTML = '<div style="padding:8px 12px;font-size:12px;color:var(--text-muted);">' + getAddProductEmptyText(q, existing, { holdingCodes, extraCodes }) + '</div>';
  } else {
    dropdown.innerHTML = results.map(p => {
      const badge = p.status === 'unmaint'
        ? '<span style="font-size:10px;padding:1px 5px;border-radius:3px;background:#FEF3C7;color:#B45309;">临时</span>'
        : '';
      const sizeYi = (p.totalScale / 100000000).toFixed(2);
      return `
      <div onclick="addSubExtraProductByCode('${p.code}')" style="padding:8px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;gap:6px;">
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><strong>${p.code}</strong> ${p.name.split('（')[0].split('(')[0]} ${badge}</span>
        <span style="font-size:10px;color:var(--text-muted);white-space:nowrap;">${sizeYi}亿</span>
      </div>`;
    }).join('');
  }
  dropdown.style.display = 'block';
  // 下拉定位：fixed 定位用视口坐标，紧贴输入框下方（脱离面板 overflow 裁剪，空表时也能完整展示）
  const rect = input.getBoundingClientRect();
  dropdown.style.top = (rect.bottom + 2) + 'px';
  dropdown.style.left = rect.left + 'px';
}

function addSubExtraProductByCode(code) {
  if (isAdjustHistoryMode()) { showToast('历史日期为只读，不支持添加申购产品'); return; }
  const prod = positionData.find(p => p.code === code);
  if (!prod) return;

  const acc = getAccount(currentAccountId);
  const st = getState(currentAccountId);
  if (!acc || !st) return;

  // 去重：本专户持仓 + 已添加的额外产品
  if (!st.subExtraProducts) st.subExtraProducts = [];
  const inHoldings = acc.holdings.some(h => h.code === code);
  const inExtra = st.subExtraProducts.some(p => p.code === code);
  if (inHoldings) {
    alert('产品 ' + code + ' 已在本专户持仓列表中（无需通过添加入口添加）');
    return;
  }
  if (inExtra) {
    alert('产品 ' + code + ' 已在申购端列表中');
    return;
  }

  // 添加到申购端候选池（非本专户持仓产品，size 用 0 表示）
  st.subExtraProducts.push({ code: prod.code, name: prod.name, size: 0 });
  // 初始化相关状态字段
  st.subSelectedMap[prod.code] = true;  // 默认勾选
  st.bpData[prod.code] = 0;
  if (!st.profitAllocationMap) st.profitAllocationMap = {};
  st.profitAllocationMap[prod.code] = 0;
  st.subAmountMap[prod.code] = 0;
  st.lossAdjData[prod.code] = 0;

  // 关闭下拉
  document.getElementById('subExtraSearchDropdown').style.display = 'none';
  document.getElementById('subExtraSearchInput').value = '';

  renderContent(acc, st);
  recalcCurrent();
}

function removeSubExtraProduct(code) {
  if (isAdjustHistoryMode()) { showToast('历史日期为只读，不支持移除申购产品'); return; }
  const acc = getAccount(currentAccountId);
  const st = getState(currentAccountId);
  if (!acc || !st || st.status === 'done' || !st.subExtraProducts) return;
  const product = st.subExtraProducts.find(p => p.code === code);
  if (!product || acc.holdings.some(h => h.code === code)) return;
  showConfirmDialog({
    title: '移除申购产品',
    bodyHTML: '<p style="font-size:14px;color:var(--text);">移除“<strong>' + escHtml(product.name) + '（' + escHtml(code) + '）</strong>”将清除其本次调仓输入，不影响已有持仓，是否继续？</p>',
    confirmText: '确认移除',
    danger: true,
    onConfirm: () => {
      if (currentAccountId !== acc.id || getState(acc.id) !== st || st.status === 'done') return;
      const idx = st.subExtraProducts.findIndex(p => p.code === code);
      if (idx === -1) return;
      st.subExtraProducts.splice(idx, 1);
      ['bpData','profitAllocationMap','subAmountMap','lossAdjData','subSelectedMap','fundSourceMap'].forEach(key => { if(st[key]) delete st[key][code]; });
      renderContent(acc, st);
      recalcCurrent();
      showToast('已从申购区移除产品 ' + code);
    }
  });
}

function addCustomProduct() {
  document.getElementById('addChannelProductModal').classList.add('show');
  const input = document.getElementById('chProdSearch');
  if (input) input.value = '';
  renderChannelProductPicker('');
  setTimeout(() => input && input.focus(), 50);
}

function closeAddChannelProductModal() {
  document.getElementById('addChannelProductModal').classList.remove('show');
}

// 渲染「添加理财产品」选择弹窗列表（来源：SPV持仓查询数据）
function renderChannelProductPicker(query) {
  const listEl = document.getElementById('chProdList');
  if (!listEl) return;
  const acc = getAccount(currentAccountId);
  const q = (query !== undefined ? query : (document.getElementById('chProdSearch') || {}).value || '').trim().toLowerCase();

  let items = getAddableProducts();
  if (q) items = items.filter(p => p.code.toLowerCase().includes(q) || p.name.toLowerCase().includes(q));

  if (!items.length) {
    listEl.innerHTML = '<div style="padding:16px;text-align:center;font-size:12px;color:var(--text-muted);">' + (q ? getAddProductEmptyText(q) : '暂无可添加理财产品') + '</div>';
    return;
  }

  // 排序：已上线在前，未上线在后
  items.sort((a, b) => (a.status === 'online' ? 0 : 1) - (b.status === 'online' ? 0 : 1));

  listEl.innerHTML = items.map(p => {
    const exists = acc && acc.holdings.find(h => h.code === p.code);
    const badge = p.status === 'online'
      ? '<span style="font-size:10px;padding:1px 5px;border-radius:3px;background:#DCFCE7;color:#15803D;">已上线</span>'
      : '<span style="font-size:10px;padding:1px 5px;border-radius:3px;background:#FEF3C7;color:#B45309;">临时</span>';
    const sizeYi = (p.totalScale / 100000000).toFixed(2);
    const btn = exists
      ? '<button disabled style="padding:4px 12px;font-size:11px;border:1px solid var(--border);border-radius:4px;background:#F1F5F9;color:#94A3B8;cursor:not-allowed;">已存在</button>'
      : `<button onclick="addProductFromSearch('${p.code}')" style="padding:4px 12px;font-size:11px;border:1px solid var(--primary);border-radius:4px;background:#fff;color:var(--primary);cursor:pointer;">+ 添加</button>`;
    return `
    <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #f0f0f0;">
      <div style="flex:1;min-width:0;">
        <div style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><strong>${p.code}</strong> ${p.name}</div>
        <div style="font-size:10px;color:var(--text-muted);margin-top:2px;">持仓规模 ${sizeYi} 亿 · 持有 ${p.spvCount} 只专户</div>
      </div>
      ${badge}
      ${btn}
    </div>`;
  }).join('');
}

// 点击其他地方关闭搜索下拉
document.addEventListener('click', function(e) {
  // 头寸页产品搜索下拉
  const dropdown = document.getElementById('productSearchDropdown');
  const input = document.getElementById('productSearchInput');
  if (dropdown && input && e.target !== input && !dropdown.contains(e.target)) {
    dropdown.style.display = 'none';
  }
  // 申购端理财产品搜索下拉（点击输入框/下拉内部不关闭，其余区域点击即隐藏）
  const subDropdown = document.getElementById('subExtraSearchDropdown');
  const subInput = document.getElementById('subExtraSearchInput');
  if (subDropdown && subInput && e.target !== subInput && !subDropdown.contains(e.target)) {
    subDropdown.style.display = 'none';
  }
});

</script>
