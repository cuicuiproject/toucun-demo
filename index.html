const ADJUST_DRAFT_STORAGE_KEY = 'adjust_draft_v1';
const ADJUST_DRAFT_FIELDS = [
  'subMode', 'bpData', 'feeRateN', 'bpLoss', 'totalLoss', 'totalProfit', 'bpBaseSource',
  'lossAdjData', 'lossSelectedMap', 'subSelectedMap', 'lossRedeemAmt', 'profitAllocationMap',
  'subAmountMap', 'fundSourceMap', 'redSearchKw', 'subExtraProducts', 'bpGrowth', 'accountSize'
];
function cloneAdjustValue(value) {
  return value == null ? value : JSON.parse(JSON.stringify(value));
}
function getAdjustDraftKey(accountId, date) {
  return (date || adjustTradeDate || getTodayStr()) + '::' + accountId;
}
function loadAdjustDrafts() {
  try {
    const raw = localStorage.getItem(ADJUST_DRAFT_STORAGE_KEY);
    const data = raw ? JSON.parse(raw) : {};
    return data && typeof data === 'object' ? data : {};
  } catch (e) {
    return {};
  }
}
function persistAdjustDrafts(drafts) {
  try { localStorage.setItem(ADJUST_DRAFT_STORAGE_KEY, JSON.stringify(drafts || {})); } catch (e) {}
}
function getAdjustDraft(accountId, date) {
  return loadAdjustDrafts()[getAdjustDraftKey(accountId, date)];
}
function buildAdjustDraftPayload(accountId, st) {
  const payload = {
    accountId,
    tradeDate: adjustTradeDate || getTodayStr(),
    savedAt: new Date().toISOString(),
    state: {}
  };
  ADJUST_DRAFT_FIELDS.forEach(field => {
    payload.state[field] = cloneAdjustValue(st[field]);
  });
  return payload;
}
function applyAdjustDraftToState(accountId, st) {
  if (!st) return false;
  const draft = getAdjustDraft(accountId);
  if (!draft || !draft.state) return false;
  ADJUST_DRAFT_FIELDS.forEach(field => {
    if (Object.prototype.hasOwnProperty.call(draft.state, field)) {
      st[field] = cloneAdjustValue(draft.state[field]);
    }
  });
  st.status = 'progress';
  st._draftRestored = true;
  st._draftSavedAt = draft.savedAt || '';
  return true;
}
function saveAdjustDraft(accountId) {
  if (isAdjustHistoryMode()) { showToast('历史日期为只读，不支持保存草稿'); return; }
  if (!accountId) { showToast('请先添加并选择专户'); return; }
  const acc = getAccount(accountId);
  const st = getState(accountId);
  if (!acc || !st) return;
  if (st.status === 'done') { showToast('该专户已同步，只读状态不支持保存草稿'); return; }
  saveCurrentState();
  recalcCurrent();
  const drafts = loadAdjustDrafts();
  drafts[getAdjustDraftKey(accountId)] = buildAdjustDraftPayload(accountId, st);
  persistAdjustDrafts(drafts);
  showToast('草稿已保存。');
}
function clearAdjustDraft(accountId, date) {
  if (!accountId) return;
  const drafts = loadAdjustDrafts();
  const key = getAdjustDraftKey(accountId, date);
  if (Object.prototype.hasOwnProperty.call(drafts, key)) {
    delete drafts[key];
    persistAdjustDrafts(drafts);
  }
}
function restoreAdjustDraftSidebar() {
  const drafts = loadAdjustDrafts();
  const prefix = (adjustTradeDate || getTodayStr()) + '::';
  Object.keys(drafts).forEach(key => {
    if (!key.startsWith(prefix)) return;
    const accountId = key.slice(prefix.length);
    const acc = getAccount(accountId);
    if (!acc || getSpvStatusById(accountId).terminated) return;
    leftListIds.add(accountId);
  });
}

function getAccount(accountId) {
  return allAccounts.find(a => a.id === accountId);
}

// 专户维护状态查询：根据专户 id 返回其在「专户产品维护」中的状态
// 返回 { online, terminated, label, klass }
//   已上线   → online=true,  terminated=false
//   已下线   → online=false, terminated=false（过渡态：仍可作来源，需出清残留持仓，打「已下线」标）
//   已清仓   → terminated=true（终态：禁止作为配对赎回来源，不出现在下拉）
// 未在维护清单中的专户（如 SPV 底层专户/信托计划/资管计划）默认视为「可正常使用」，不拦截。
function getSpvStatusById(accId) {
  const m = spvMaintList.find(p => p.id === accId);
  if (!m) return { online: true, terminated: false, label: '', klass: '' };  // 非维护清单内（底层专户）→ 放行
  if (m.terminated) return { online: false, terminated: true, label: '已清仓', klass: 'terminated' };
  if (!m.online) return { online: false, terminated: false, label: '已下线', klass: 'offline' };
  return { online: true, terminated: false, label: '', klass: '' };
}

// 资金来源映射：返回某理财产品持有的「其他专户」列表（排除当前操作的专户）
// 用于右栏申购端「资金来源」下拉选项：该笔申购 = 该理财产品先从来源专户赎回，再申购当前专户（一申配一赎、同产品同金额）
// 业务方向为「产品→专户」：理财产品持有的底层专户即其可配对赎回的来源
// 来源1：管理专户镜像（allAccounts.holdings 含该产品 = 该产品持有此管理专户，专户间腾挪场景）
// 来源2：SPV持仓查询（getSPVData，产品持有的底层专户/信托计划/资管计划）
// 两路合并按专户代码去重，管理专户在前（真实维护数据优先）
//
// 状态处理策略：
//   已清仓（终态）保留标记供校验使用，但不进入资金来源下拉候选。
//   已下线保留标记供确认和同步校验使用，来源选择区不展示维护状态。
//   未维护来源没有维护状态，按实际持仓来源展示。
function getOtherAccounts(productCode, currentAccId) {
  const curAcc = allAccounts.find(a => a.id === currentAccId);
  const result = [];
  const seen = new Set();

  // 来源1：管理专户（本系统持仓镜像）
  allAccounts
    .filter(a => a.id !== currentAccId)
    .filter(a => a.holdings.some(h => h.code === productCode))
    .forEach(a => {
      const h = a.holdings.find(x => x.code === productCode);
      if (!seen.has(a.code)) {
        const ms = getSpvStatusById(a.id);
        seen.add(a.code);
        result.push({
          id: a.id,
          code: a.code,
          name: a.shortName || a.name,       // 短名（用于下拉文案）
          fullName: a.name || a.shortName,   // 全名（用于 title 悬浮提示）
          nature: a.nature || '管理专户',     // 专户性质：管理专户 / 债券专户 等
          size: h.size,
          spvOnline: ms.online,
          spvTerminated: ms.terminated,
          spvStatusLabel: ms.label,          // '' | '已下线' | '已清仓'
          spvStatusKlass: ms.klass,          // '' | 'offline' | 'terminated'
        });
      }
    });

  // 来源2：SPV持仓查询的底层专户（排除当前操作专户自身）
  (getSPVData(productCode) || []).forEach(h => {
    if (curAcc && h.spvCode === curAcc.code) return;  // 当前专户不可作为自身申购来源
    if (seen.has(h.spvCode)) return;                    // 与管理专户去重
    // 底层专户若在维护清单中且已清仓，同样保留 + 打标（屏蔽交给调用方）
    const accMatch = allAccounts.find(a => a.code === h.spvCode);
    const ms = accMatch ? getSpvStatusById(accMatch.id) : { online: true, terminated: false, label: '', klass: '' };
    seen.add(h.spvCode);
    // SPV 底层专户性质：信托计划 / 资管计划（由专户名称推断，供下拉标注展示）
    const spvNature = /信托/.test(h.spvName || '') ? '信托计划'
                    : /资产管理计划|资管/.test(h.spvName || '') ? '资管计划'
                    : '底层专户';
    result.push({
      id: h.spvCode,
      code: h.spvCode,
      name: h.spvName,
      fullName: h.spvName,
      nature: spvNature,
      size: h.scale || (h.qty * h.nav) || 0,
      spvOnline: ms.online,
      spvTerminated: ms.terminated,
      spvStatusLabel: ms.label,
      spvStatusKlass: ms.klass,
    });
  });

  return result;
}

// 资金来源下拉的选项文案：专户短名 · 性质 · 持有 XX万
// 来源选择区仅展示名称、性质和持有规模；已清仓来源不进入下拉候选
// 例：「鑫和7号 · 管理专户 · 持有1473.5万」
function fmtFundSourceOption(o) {
  const wan = (o.size || 0) / 10000;
  const wanTxt = wan >= 1000
    ? wan.toLocaleString('zh-CN', { maximumFractionDigits: 0 })
    : wan.toLocaleString('zh-CN', { maximumFractionDigits: 1 });
  return `${o.name} · ${o.nature} · 持有${wanTxt}万`;
}

function getAccountHoldingScale(acc) {
  return (acc && acc.holdings ? acc.holdings : []).reduce((sum, h) => sum + (h.size || 0), 0);
}

// ==================== SIDEBAR ====================

function getSidebarAddCandidates() {
  const inLeftList = new Set(getSidebarItems().map(a => a.id));
  return spvMaintList
    .filter(p => !p.terminated)
    .sort((a, b) => a.sortOrder - b.sortOrder)
    .map(p => allAccounts.find(a => a.id === p.id))
    .filter(Boolean)
    .filter(a => getAccountHoldingScale(a) > 0)
    .filter(a => !inLeftList.has(a.id));
}

// 顶部搜索框：列出未在左侧栏、非已清仓且当日持有规模大于0的专户
function renderSidebarAddSelect() {
  const input = document.getElementById('sidebarAddSearchInput');
  const selected = document.getElementById('sidebarAddSelectedId');
  const dropdown = document.getElementById('sidebarAddDropdown');
  const btn = document.querySelector('.sidebar-add-bar button');
  if (!input) return;
  const historyView = isAdjustHistoryMode();
  const candidates = getSidebarAddCandidates();
  input.disabled = historyView;
  input.placeholder = historyView ? '历史日期为只读，不支持添加专户' : (candidates.length ? '输入专户代码/名称搜索…' : '暂无可添加专户');
  input.title = historyView ? '历史日期为只读，不支持添加专户' : '输入专户代码、简称或名称搜索后选择';
  if (selected) selected.value = '';
  if (dropdown) { dropdown.style.display = 'none'; dropdown.innerHTML = ''; }
  if (btn) {
    btn.disabled = historyView || !candidates.length;
    btn.title = historyView ? '历史日期为只读，不支持添加专户' : '选择候选专户后加入左侧栏';
  }
}

function onSidebarAddSearch(value) {
  const selected = document.getElementById('sidebarAddSelectedId');
  if (selected) selected.value = '';
  renderSidebarAddDropdown(value);
}

function renderSidebarAddDropdown(value) {
  if (isAdjustHistoryMode()) return;
  const dropdown = document.getElementById('sidebarAddDropdown');
  if (!dropdown) return;
  const q = String(value || '').trim().toLowerCase();
  const candidates = getSidebarAddCandidates();
  let results = candidates;
  if (q) {
    results = candidates.filter(a =>
      String(a.code || '').toLowerCase().includes(q) ||
      String(a.shortName || '').toLowerCase().includes(q) ||
      String(a.name || '').toLowerCase().includes(q)
    );
  }
  results = results.slice(0, 30);
  if (!candidates.length) {
    dropdown.innerHTML = '<div class="sidebar-add-empty">暂无可添加专户</div>';
  } else if (!results.length) {
    dropdown.innerHTML = '<div class="sidebar-add-empty">未找到可添加专户，请更换代码或名称</div>';
  } else {
    dropdown.innerHTML = results.map(a => {
      const ms = getSpvStatusById(a.id);
      const tempTag = ms.online ? '' : '<span style="color:#B45309;"> · 临时</span>';
      const scaleTxt = getAccountHoldingScale(a).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
      const label = escHtml(a.shortName || a.name || a.code);
      const name = escHtml(a.name || '');
      const code = escHtml(a.code || '');
      return `<div class="sidebar-add-option" onclick="selectSidebarAddAccount('${a.id}')">
        <div>${label}<span class="code">${code}</span>${tempTag}</div>
        <div class="meta">${name} · 持有规模 ${scaleTxt} 元</div>
      </div>`;
    }).join('');
  }
  dropdown.style.display = 'block';
}

function selectSidebarAddAccount(accountId) {
  const acc = getAccount(accountId);
  if (!acc) return;
  const input = document.getElementById('sidebarAddSearchInput');
  const selected = document.getElementById('sidebarAddSelectedId');
  const dropdown = document.getElementById('sidebarAddDropdown');
  if (input) input.value = (acc.shortName || acc.name) + '（' + acc.code + '）';
  if (selected) selected.value = accountId;
  if (dropdown) dropdown.style.display = 'none';
}

function onSidebarAddKeydown(event) {
  if (event.key !== 'Enter') return;
  event.preventDefault();
  const selected = document.getElementById('sidebarAddSelectedId');
  if (selected && selected.value) { addAccountFromSelect(); return; }
  const q = String((event.target && event.target.value) || '').trim().toLowerCase();
  if (!q) return;
  const matches = getSidebarAddCandidates().filter(a =>
    String(a.code || '').toLowerCase().includes(q) ||
    String(a.shortName || '').toLowerCase().includes(q) ||
    String(a.name || '').toLowerCase().includes(q)
  );
  if (matches.length === 1) {
    selectSidebarAddAccount(matches[0].id);
    addAccountFromSelect();
  } else {
    renderSidebarAddDropdown(q);
  }
}

// 顶部「+ 添加」按钮：把选中专户加入 leftListIds + allAccounts 并刷新
function addAccountFromSelect() {
  if (isAdjustHistoryMode()) { showToast('历史日期为只读，不支持添加专户'); return; }
  const selected = document.getElementById('sidebarAddSelectedId');
  const accountId = selected ? selected.value : '';
  if (!accountId) { showToast('请先搜索并选择要添加的专户'); return; }
  // save current before switching
  if (currentAccountId && currentAccountId !== accountId) {
    saveCurrentState();
  }

  leftListIds.add(accountId);
  currentAccountId = accountId;
  const acc = getAccount(accountId);
  const st = getState(accountId);

  // 账户对象或调仓状态缺失（如专户已被移除）：不切换，保持原状并提示
  if (!acc || !st) {
    currentAccountId = null;
    renderSidebar();
    showToast('该专户已不在左侧栏列表中，无法进入调仓');
    return;
  }

  // mark as in-progress when opened
  if (st.status === 'pending') {
    st.status = 'progress';
  }

  if (selected) selected.value = '';
  const input = document.getElementById('sidebarAddSearchInput');
  if (input) input.value = '';
  const dropdown = document.getElementById('sidebarAddDropdown');
  if (dropdown) dropdown.style.display = 'none';
  renderSidebar();
  renderContent(acc, st);
}
function switchAccount(accountId) {
  if (isAdjustHistoryMode()) return;
  if (!leftListIds.has(accountId)) {
    renderSidebar();
    showToast('该专户已不在左侧栏列表中，无法进入调仓');
    return;
  }
  const acc = getAccount(accountId);
  const st = getState(accountId);
  if (!acc || !st) {
    leftListIds.delete(accountId);
    if (currentAccountId === accountId) currentAccountId = null;
    renderSidebar();
    showToast('该专户已不在左侧栏列表中，无法进入调仓');
    return;
  }
  if (currentAccountId && currentAccountId !== accountId) saveCurrentState();
  currentAccountId = accountId;
  if (st.status === 'pending') st.status = 'progress';
  renderSidebar();
  renderContent(acc, st);
}
function getSidebarItems() {
  return Array.from(leftListIds)
    .map(id => getAccount(id))
    .filter(Boolean)
    .filter(acc => !getSpvStatusById(acc.id).terminated);
}

function renderSidebar() {
  renderSidebarAddSelect();
  const list = document.getElementById('sidebarList');
  if (!list) return;
  const items = getSidebarItems();
  if (!items.length) {
    list.innerHTML = '<div class="sidebar-empty">暂无专户，请从顶部下拉选择并点击「+ 添加」</div>';
    return;
  }
  list.innerHTML = items.map(acc => {
    const st = getState(acc.id);
    const status = st ? st.status : 'pending';
    const active = acc.id === currentAccountId ? ' active' : '';
    const demoTag = acc.id === 'ningju5'
      ? '<span class="sidebar-demo-tag profit">收益分配示例</span>'
      : (acc.id === 'xinhe14' ? '<span class="sidebar-demo-tag bp">BP模式示例</span>' : '');
    const syncTag = status === 'done' ? '<span class="sidebar-sync-tag">已同步</span>' : '';
    return `
      <div class="sidebar-item${active}" onclick="switchAccount('${acc.id}')" title="${acc.name}（${acc.code}）">
        <span class="status-dot ${status}"></span>
        <span class="item-name">${acc.shortName || acc.name}</span>
        ${demoTag}
        ${syncTag}
        <span class="item-remove" onclick="event.stopPropagation(); removeAccount('${acc.id}')" title="移除">×</span>
      </div>`;
  }).join('');
}
function saveCurrentState() {
  if (!currentAccountId) return;
  const st = getState(currentAccountId);
  // read current form values
  const bpGrowthEl = document.getElementById('bpGrowth');
  const bpLossEl = document.getElementById('bpLoss');

  if (bpGrowthEl) st.bpGrowth = parseFloat(bpGrowthEl.value) || st.bpGrowth;
  if (bpLossEl) st.bpLoss = parseFloat(bpLossEl.value) || st.bpLoss;
}

function getAccountName(sel) {
  const acc = allAccounts.find(a => a.id === sel);
  return acc ? acc.name : (allAccounts[0] ? allAccounts[0].name : '');
}

// ==================== CALC ====================

// 申购本金 = 理财产品SPV持仓中的持有专户总规模 × 目标BP / 调整BP，金额保留到分。
function calcBpAmount(productScale, bp, totalBP) {
  if (![productScale, bp, totalBP].every(Number.isFinite) || productScale <= 0 || bp < 0 || totalBP <= 0) return 0;
  return Math.round(productScale * bp / totalBP * 100) / 100;
}

function getPositionProductScale(code) {
  // 来源：《理财产品SPV持仓》里该理财产品的持有专户总规模，和头寸管理页产品信息口径一致。
  return (getSPVData(code) || []).reduce((sum, h) => {
    const scale = Number(h.scale || ((h.qty || 0) * (h.nav || 0)) || 0);
    return sum + (Number.isFinite(scale) && scale > 0 ? scale : 0);
  }, 0);
}

function getBpProductScale(st, code) {
  return getPositionProductScale(code);
}

function rebalanceDifference(redeem, subscribe) {
  return Math.round(subscribe * 100) - Math.round(redeem * 100);
}

function rebalanceMessage(redeem, subscribe) {
  const cents = rebalanceDifference(redeem, subscribe);
  if (!cents) return subscribe > 0 ? '✅ 调仓平衡' : '待输入有效交易';
  const subText = subscribe.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
  const redText = redeem.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
  const diffText = (Math.abs(cents) / 100).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
  return '申购总额' + subText + '元，赎回总额' + redText + '元，多' + (cents > 0 ? '申购' : '赎回') + diffText + '元，请核对后确认同步。';
}

function calcBpRatioPct(bp, totalBP) {
  return totalBP > 0 ? (bp || 0) / totalBP * 100 : 0;
}

// 收益分配金额决定分配占比，申购金额按该占比作用于专户总规模。
function calcProfitBasedSubscription(accountSize, allocationAmount, totalProfit) {
  if (!(accountSize > 0) || !(allocationAmount > 0) || !(totalProfit > 0)) return 0;
  return Math.round(accountSize * allocationAmount / totalProfit * 100) / 100;
}

function recalcCurrent() {
  const acc = getAccount(currentAccountId);
  const st = getState(currentAccountId);
  if (!acc || !st) return;

  // save top-bar params to state before recalc
  const bpGrowthEl = document.getElementById('bpGrowth');
  const bpLossEl = document.getElementById('bpLoss');
  if (bpGrowthEl) st.bpGrowth = parseFloat(bpGrowthEl.value) || st.bpGrowth;
  if (bpLossEl) st.bpLoss = parseFloat(bpLossEl.value) || st.bpLoss;

  recalcLossMode(acc, st);
}

function recalcLossMode(acc, st) {
  // ===== 左栏：累计赎回金额 =====
  let totalRedeemAmt = 0;
  acc.holdings.forEach(p => {
    const sel = (st.lossSelectedMap && st.lossSelectedMap[p.code] !== undefined) ? st.lossSelectedMap[p.code] : true;
    const redAmt = st.lossRedeemAmt?.[p.code] || 0;
    if (sel && redAmt > 0) {
      totalRedeemAmt += redAmt;
    }
  });

  // 更新左栏汇总
  const totalRedeemEl = document.getElementById('totalRedeemAmt');
  if (totalRedeemEl) totalRedeemEl.textContent = totalRedeemAmt.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const totalRedeemWanEl = document.getElementById('totalRedeemWan');
  if (totalRedeemWanEl) {
    const f = fmtBigAmount(totalRedeemAmt);
    totalRedeemWanEl.textContent = f.text;
    const uEl = document.getElementById('totalRedeemWanUnit');
    if (uEl) uEl.textContent = f.unit;
  }

  // ===== 右栏：按BP占比自动分摊申购金额 + 实际金额=申购-调减 =====
  // 申购金额（BP模式）= 《理财产品SPV持仓》中该理财产品的持有专户总规模 × 目标BP ÷ 调整BP；赎回合计需与申购合计平衡。
  // 注意：申购产品指定「资金来源专户」的持有规模不加入申购资金池——
  // 它仅用于校验该来源专户能否生成同金额的配套赎回（配对可行性），申购、赎回两条流水独立核算。

  // 收集勾选申购的产品代码（申购端候选池 = 用户手动添加的申购产品清单，初始为空）
  let sumSub = 0, sumI = 0, sumAllocation = 0;
  const subSelectedCodes = [];
  const subProductPool = st.subExtraProducts || [];
  subProductPool.forEach(p => {
    const sel = (st.subSelectedMap && st.subSelectedMap[p.code] !== undefined) ? st.subSelectedMap[p.code] : true;
    if (sel) subSelectedCodes.push(p.code);
  });

  // 调整BP是各行占比的分母；明细BP合计不得超过调整BP，允许少分。
  const inputTotalBP = st.totalLoss || 0;

  // 调整BP未输入时保留目标BP，暂不计算有效申购金额；同步前必须补齐调整BP。
  const bpHintEls = document.querySelectorAll('.total-bp-hint');
  bpHintEls.forEach(el => { el.style.display = (st.subMode === 'bp' && inputTotalBP <= 0) ? 'inline-flex' : 'none'; });

  // 第二步：按业务BP口径计算各产品申购金额。
  subSelectedCodes.forEach((code) => {
    const p = subProductPool.find(h => h.code === code);
    if (!p) return;
    const bp = st.bpData[code] || 0;
    // 调减金额仅BP模式生效（申购金额自动分摊无法直改，需调减微调）；收益分配模式下分配额手输，调减强制为0
    const adj = 0; // BP按公式生成最终金额，不允许调减

    let ratio = 0, ratioPct = 0;
    let subAmt = 0;

    if (st.subMode === 'bp') {
      // 每行按《理财产品SPV持仓》里该理财产品的持有专户总规模和目标BP比例计算。
      ratio = inputTotalBP > 0 ? bp / inputTotalBP : 0;
      ratioPct = calcBpRatioPct(bp, inputTotalBP);
      subAmt = calcBpAmount(getBpProductScale(st, code), bp, inputTotalBP);
      if (subAmt < 0) subAmt = 0;
      // 写入状态 + 回填DOM
      if (!st.subAmountMap) st.subAmountMap = {};
      st.subAmountMap[code] = subAmt;
      const subInputEl = document.getElementById('subAmtInput_' + code);
      if (subInputEl) subInputEl.value = subAmt ? subAmt.toLocaleString('zh-CN') : '';
    } else {
      // 收益分配模式：分配收益决定占比，系统按占比 × 专户总规模生成申购金额。
      const allocationAmt = st.profitAllocationMap?.[code] || 0;
      const totalProfit = st.totalProfit || 0;
      subAmt = calcProfitBasedSubscription(acc.accountSize || 0, allocationAmt, totalProfit);
      sumAllocation += allocationAmt;
      if (!st.subAmountMap) st.subAmountMap = {};
      st.subAmountMap[code] = subAmt;
      setCell('generatedSubAmt_' + code, subAmt ? subAmt.toLocaleString('zh-CN') : '--');
    }

    // 实际金额 = 申购金额 − 调减金额
    const I_val = subAmt - adj;

    if (st.subMode === 'bp') {
      setCell('ratio_' + code, ratioPct.toFixed(2) + '%');
    } else {
      // 收益分配模式：占比 = 该产品分配收益金额 ÷ 本次可分配总收益（分母是总收益，不是分配额合计）
      const totalProfit = st.totalProfit || 0;
      const allocationAmt = st.profitAllocationMap?.[code] || 0;
      setCell('ratio_' + code, totalProfit > 0 ? (allocationAmt / totalProfit * 100).toFixed(2) + '%' : '--');
    }
    setCell('I_' + code, fmtNum(I_val));

    sumSub += subAmt; sumI += I_val;
  });

  // 收益分配模式：顶部剩余金额实时更新 + 超分配拦截提示
  // Σ分配 ≤ 总收益（允许不满额分配、留存部分收益）；超额分配属异常，标红并在同步时阻断
  if (st.subMode === 'wan') {
    const totalProfit = st.totalProfit || 0;
    const remain = totalProfit - sumAllocation;
    const remainEl = document.getElementById('remainProfit');
    if (remainEl) {
      remainEl.textContent = remain.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
      remainEl.style.color = remain < 0 ? '#DC2626' : '#6D28D9';
    }
    const warnEl = document.getElementById('profitWarn');
    if (warnEl) {
      if (totalProfit <= 0) {
        warnEl.textContent = '⚠ 请输入大于0的总收益金额。';
        warnEl.style.display = 'inline-block';
      } else {
        warnEl.style.display = 'none';
      }
    }
  }

  // 未勾选产品：清空显示（遍历申购端候选池）
  subProductPool.forEach(p => {
    const sel = (st.subSelectedMap && st.subSelectedMap[p.code] !== undefined) ? st.subSelectedMap[p.code] : true;
    if (!sel) {
      setCell('ratio_' + p.code, '--');
      setCell('I_' + p.code, '--');
      const subInputEl = document.getElementById('subAmtInput_' + p.code);
      if (subInputEl) subInputEl.value = '';
      const allocationInputEl = document.getElementById('profitAllocationInput_' + p.code);
      if (allocationInputEl) allocationInputEl.value = '';
      if (st.subAmountMap) st.subAmountMap[p.code] = 0;
      if (st.profitAllocationMap) st.profitAllocationMap[p.code] = 0;
      setCell('generatedSubAmt_' + p.code, '--');
    }
  });

  // ===== 行内配对可行性校验（实时提示，不阻断输入）=====
  // 已指定资金来源的申购行：来源专户持有该产品的规模 ≥ 实际申购金额 才能生成同金额配套赎回。
  // 来源持有规模仅作校验用途，不参与申购金额计算（不加入申购资金池）。
  subProductPool.forEach(p => {
    const warnEl = document.getElementById('srcWarn_' + p.code);
    if (!warnEl) return;
    const selEl = document.getElementById('srcSelect_' + p.code);
    const subSel = (st.subSelectedMap && st.subSelectedMap[p.code] !== undefined) ? st.subSelectedMap[p.code] : true;
    const srcId = (st.fundSourceMap && st.fundSourceMap[p.code]) || '';
    if (!subSel || !srcId) {
      warnEl.style.display = 'none';
      if (selEl) selEl.style.borderColor = srcId ? '' : '#CBD5E1';
      return;
    }
    // 来源规模从统一来源列表取（管理专户镜像 + SPV底层专户），与下拉选项同源
    const srcInfo = getOtherAccounts(p.code, acc.id).find(o => o.id === srcId);
    // 已清仓来源：渲染阶段已被清空，此处不再产生配对预警（交由同步校验兜底）
    if (srcInfo && srcInfo.spvTerminated) {
      warnEl.style.display = 'none';
      if (selEl) selEl.style.borderColor = '';
      return;
    }
    const srcSize = srcInfo ? srcInfo.size : 0;
    const subAmt = st.subAmountMap?.[p.code] || 0;
    const adj = 0; // BP按公式生成最终金额，不允许调减
    const actual = subAmt - adj;
    if (actual > srcSize) {
      warnEl.textContent = '⚠ ' + p.code + '：配套赎回金额超过来源专户当前可用规模' + srcSize.toLocaleString('zh-CN') + '元，请调整。';
      warnEl.style.display = 'block';
      if (selEl) selEl.style.borderColor = '#DC2626';
    } else {
      warnEl.style.display = 'none';
      if (selEl) selEl.style.borderColor = '';
    }
  });

  // 更新右栏汇总（累计申购金额及折合单位）
  const totalSubEl = document.getElementById('totalSubAmt');
  if (totalSubEl) {
    totalSubEl.textContent = sumSub.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  const totalSubWanEl = document.getElementById('totalSubWan');
  if (totalSubWanEl) {
    const f = fmtBigAmount(sumSub);
    totalSubWanEl.textContent = f.text;
    const uEl = document.getElementById('totalSubWanUnit');
    if (uEl) uEl.textContent = f.unit;
  }
  const tiRightEl = document.getElementById('totalI_right');
  const tiUnitEl = document.getElementById('totalIUnit');
  if (tiRightEl) {
    const f = fmtBigAmount(sumI);
    tiRightEl.textContent = f.text;
    if (tiUnitEl) tiUnitEl.textContent = f.unit;
  }

  // ===== 日终平衡指示器 =====
  const balRedeemEl = document.getElementById('balRedeem');
  const balSubEl = document.getElementById('balSub');
  const balStatusEl = document.getElementById('balStatus');
  if (balRedeemEl) balRedeemEl.textContent = totalRedeemAmt.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  if (balSubEl) balSubEl.textContent = sumSub.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  if (balStatusEl) {
    if (st.subMode === 'wan') {
      // 收益分配模式：申购金额由收益分配额决定，与左栏赎回额不做守恒约束（赎回额仅为参考）
      const totalProfit = st.totalProfit || 0;
      const remain = totalProfit - sumAllocation;
      const diff = totalRedeemAmt - sumSub;
      const diffCents = Math.round(diff * 100);
      const diffText = diffCents === 0
        ? '申赎相等'
        : rebalanceMessage(totalRedeemAmt, sumSub);
      const diffHtml = diffCents === 0
        ? '<span style="color:#16A34A;">申赎相等</span>'
        : '<span style="color:#DC2626;">' + diffText + '</span>';
      const allocatedPct = totalProfit > 0 ? (sumAllocation / totalProfit * 100) : 0;
      const remainingPct = 100 - allocatedPct;
      if (totalProfit <= 0) {
        balStatusEl.textContent = '待输入总收益';
        balStatusEl.style.color = '#64748B';
        balStatusEl.title = '';
      } else if (remain < 0) {
        balStatusEl.innerHTML = '⚠️ 已分配 ' + allocatedPct.toFixed(2) + '% · 超出 ' + Math.abs(remainingPct).toFixed(2) + '% · ' + diffHtml;
        balStatusEl.style.color = '#DC2626';
        balStatusEl.title = '收益分配模式下申购金额由分配收益决定，申赎差额仅提示，不阻断同步。';
      } else {
        balStatusEl.innerHTML = '✅ 已分配 ' + allocatedPct.toFixed(2) + '% · 剩余 ' + remainingPct.toFixed(2) + '% · ' + diffHtml;
        balStatusEl.style.color = diffCents === 0 ? '#16A34A' : '#6D28D9';
        balStatusEl.title = '收益分配模式下申购金额由分配收益决定，申赎差额仅提示，不阻断同步。';
      }
    } else if (st.subMode === 'bp') {
      const detailBpTotal = subSelectedCodes.reduce((sum, code) => sum + (st.bpData[code] || 0), 0);
      const bpTotalExceeded = Number.isFinite(inputTotalBP) && inputTotalBP > 0 && detailBpTotal > inputTotalBP;
      const valid = Number.isFinite(inputTotalBP) && inputTotalBP > 0 && !bpTotalExceeded && subSelectedCodes.length > 0 && subSelectedCodes.every(code => getBpProductScale(st, code) > 0 && Number.isFinite(st.bpData[code]) && st.bpData[code] > 0);
      balStatusEl.textContent = bpTotalExceeded ? ('⚠ 目标BP合计' + detailBpTotal + '，已超过调整BP' + inputTotalBP + '，请调整。') : (valid ? rebalanceMessage(totalRedeemAmt, sumSub) : '⚠ 请填写调整BP和目标BP');
      balStatusEl.style.color = !valid ? '#DC2626' : (sumSub > 0 && rebalanceDifference(totalRedeemAmt, sumSub) === 0 ? '#16A34A' : '#DC2626');
      balStatusEl.title = '最终申购 = 该理财产品持有所有专户的规模之和 × 目标BP ÷ 调整BP；目标BP合计不得超过调整BP。';
    } else if (totalRedeemAmt === 0 && sumSub === 0) {
      balStatusEl.textContent = '待输入';
      balStatusEl.style.color = '#64748B';
    } else if (Math.abs(totalRedeemAmt - sumSub) < 0.01) {
      balStatusEl.textContent = '✅ 日终平';
      balStatusEl.style.color = '#16A34A';
    } else {
      const diff = totalRedeemAmt - sumSub;
      balStatusEl.textContent = '⚠️ 差额 ' + diff.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' 元（仅提示，不阻断）';
      balStatusEl.style.color = '#DC2626';
    }
  }
}

// ==================== HELPERS ====================

function setCell(id, value) {
  const el = document.getElementById(id);
  if (el) el.textContent = value;
}

function fmtNum(v) {
  if (v === undefined || v === null || isNaN(v)) return '--';
  return v.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

// 大额金额智能单位：按 元 → 万元 → 亿元 自动选档（>=1亿用亿元，>=1万用万元，否则元）
// 返回 { text: 格式化数值, unit: 单位 }（万/亿档保留 2 位小数，与明细行精度一致）
function fmtBigAmount(v) {
  if (v === undefined || v === null || isNaN(v)) return { text: '--', unit: '元' };
  const abs = Math.abs(v);
  let unit = '元';
  let val = v;
  if (abs >= 100000000) { unit = '亿元'; val = v / 100000000; }
  else if (abs >= 10000) { unit = '万元'; val = v / 10000; }
  // 元档不带小数（金额为整数元）；万/亿档保留 2 位小数，自动去尾0
  const text = (unit === '元')
    ? val.toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 0 })
    : val.toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  return { text, unit };
}

// Toast 提示（默认 3 秒自动消失）
function showToast(message) {
  let toast = document.getElementById('appToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'appToast';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
}

// ==================== 系统确认弹窗（替代浏览器原生 confirm） ====================
function showConfirmDialog(opts) {
  const { title, bodyHTML, confirmText = '确认', danger = false, onConfirm } = opts;
  const old = document.getElementById('appConfirmModal');
  if (old) old.remove();
  const html = `
    <div class="modal-overlay show" id="appConfirmModal" onclick="closeConfirmDialog(event)">
      <div class="modal" style="width:440px;max-width:90vw;" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>${title}</h3>
          <span class="modal-close" onclick="closeConfirmDialog()" style="display:flex;cursor:pointer;font-size:20px;color:var(--text-muted);padding:4px;line-height:1;">×</span>
        </div>
        <div class="modal-body">${bodyHTML}</div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="closeConfirmDialog()">取消</button>
          <button class="btn" style="${danger ? 'background:var(--danger);color:#fff;' : ''}" onclick="confirmDialogOK()">${confirmText}</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  window.__confirmDialogCb = onConfirm;
}

function closeConfirmDialog(e) {
  if (e && e.target && e.target.id !== 'appConfirmModal') return;
  const modal = document.getElementById('appConfirmModal');
  if (modal) modal.remove();
  window.__confirmDialogCb = null;
}

function confirmDialogOK() {
  const cb = window.__confirmDialogCb;
  closeConfirmDialog();
  if (cb) cb();
}

// ==================== ACTIONS ====================

function normalizePositiveIntegerInputValue(value) {
  const text = String(value || '');
  if (/[-+.eE]/.test(text)) return '';
  const raw = text.replace(/\D/g, '');
  if (!raw) return '';
  const num = parseInt(raw, 10);
  return num > 0 ? String(num) : '';
}

function getPositiveIntegerInputValue(value) {
  const normalized = normalizePositiveIntegerInputValue(value);
  const num = normalized ? parseInt(normalized, 10) : 0;
  return { normalized, num };
}

function syncPositiveIntegerInputElement(el, normalized) {
  if (!el || el.value === normalized) return;
  const pos = el.selectionStart || normalized.length;
  const oldLen = el.value.length;
  el.value = normalized;
  const nextPos = Math.max(0, pos + el.value.length - oldLen);
  try { el.setSelectionRange(nextPos, nextPos); } catch (e) {}
}

function onBPChange(code, value) {
  const st = getState(currentAccountId);
  if (!st) return;
  const bpInput = getPositiveIntegerInputValue(value);
  const el = document.activeElement;
  syncPositiveIntegerInputElement(el, bpInput.normalized);
  st.bpData[code] = bpInput.num;
  // 允许先填写目标BP；调整BP缺失由同步前校验明确提示。
  recalcCurrent();
}

function onTotalBPChange(value) {
  const st = getState(currentAccountId);
  if (!st) return;
  const bpInput = getPositiveIntegerInputValue(value);
  const el = document.activeElement && document.activeElement.id === 'totalBPInput' ? document.activeElement : document.getElementById('totalBPInput');
  syncPositiveIntegerInputElement(el, bpInput.normalized);
  st.totalLoss = bpInput.num;
  recalcCurrent();
}

function normalizeMoneyInputValue(value) {
  let raw = String(value || '').replace(/,/g, '');
  raw = raw.replace(/[^0-9.]/g, '');
  const firstDot = raw.indexOf('.');
  if (firstDot !== -1) {
    raw = raw.slice(0, firstDot + 1) + raw.slice(firstDot + 1).replace(/\./g, '');
    const parts = raw.split('.');
    raw = parts[0] + '.' + (parts[1] || '').slice(0, 2);
  }
  if (raw.startsWith('.')) raw = '0' + raw;
  return raw;
}

function getMoneyInputAmount(value) {
  const normalized = normalizeMoneyInputValue(value);
  const amount = parseFloat(normalized);
  return { normalized, amount: Number.isFinite(amount) ? amount : 0 };
}

function syncMoneyInputElement(el, normalized) {
  if (!el || el.value === normalized) return;
  const pos = el.selectionStart || normalized.length;
  const oldLen = el.value.length;
  el.value = normalized;
  const nextPos = Math.max(0, pos + el.value.length - oldLen);
  try { el.setSelectionRange(nextPos, nextPos); } catch (e) {}
}
// 收益分配模式：本次可分配总收益（分母）变更
function onTotalProfitChange(value) {
  const st = getState(currentAccountId);
  if (!st) return;
  const el = document.getElementById('totalProfitInput');
  const money = getMoneyInputAmount(value);
  syncMoneyInputElement(el, money.normalized);
  st.totalProfit = money.amount;
  recalcCurrent();
}

// 资金来源切换：记录该笔申购的资金来源专户（同步时生成同产品、同金额的配套赎回流水）
function onFundSourceChange(code, value, el) {
  const st = getState(currentAccountId);
  if (!st) return;
  st.fundSourceMap[code] = value || '';
  // 切换后即时更新下拉样式：已选来源=橙色加粗醒目提示「从哪赎回」，未选=浅灰弱化
  if (el) {
    el.style.color = value ? '#C2410C' : '#94A3B8';
    el.style.fontWeight = value ? '600' : '400';
    el.style.background = value ? '#FFFBEB' : '#F8FAFC';
    el.style.borderColor = value ? '#FDBA74' : '#CBD5E1';
  }
  if (value) {
    const acc = getAccount(currentAccountId);
    const src = getOtherAccounts(code, acc.id).find(o => o.id === value);
    showToast('已指定赎回来源：' + (src ? src.name : '') + '，同步时将自动生成同金额的配套赎回流水');
  }
  // 切换来源后立即重算：刷新行内配对可行性校验提示（来源持有规模 vs 实际申购金额）
  recalcCurrent();
}



function onLossAdjChange(code, value) {
  const st = getState(currentAccountId);
  if (!st) return;

  const raw = String(value).replace(/,/g, '');
  st.lossAdjData[code] = 0;

}

// 调仓左栏：赎回端产品搜索（按代码/名称关键字过滤）
// 仅控制显示，不影响任何勾选/金额数据；已勾选或已填金额的行始终保留
function onRedSearchInput(value, evt) {
  const st = getState(currentAccountId);
  if (!st) return;
  const kw = String(value || '');
  st.redSearchKw = kw;
  // 输入过程中只更新关键字，搜索结果按稳定时机刷新。
  const composing = !!(evt && evt.isComposing) || window.__redSearchComposing;
  if (composing) return;
  // 重新聚焦到搜索框（重渲染后焦点丢失），并把光标移到末尾
  const keepFocus = kw !== '';
  renderContent(getAccount(currentAccountId), st);
  if (keepFocus) {
    const el = document.getElementById('redSearchInput');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}

function onRedSearchCommit() {
  const st = getState(currentAccountId);
  if (!st) return;
  const el = document.getElementById('redSearchInput');
  st.redSearchKw = el ? String(el.value || '') : '';
  window.__redSearchComposing = false;
  renderContent(getAccount(currentAccountId), st);
  const next = document.getElementById('redSearchInput');
  if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); }
}

// 调仓左栏：赎回金额变更
function onLossRedeemAmtChange(code, value) {
  const acc = getAccount(currentAccountId);
  const st = getState(currentAccountId);
  if (!acc || !st) return;
  if (!st.lossRedeemAmt) st.lossRedeemAmt = {};
  const inputEl = document.getElementById('lossRedeemInput_' + code);
  const money = getMoneyInputAmount(value);
  syncMoneyInputElement(inputEl, money.normalized);
  let amt = money.amount;
  if (money.normalized !== '' && amt <= 0) {
    amt = 0;
    if (inputEl) inputEl.value = '';
  }
  // 赎回金额上限校验：不得超过该产品持有专户的规模（p.size）
  const p = acc.holdings.find(h => h.code === code);
  const maxSize = p ? (p.size || 0) : 0;
  if (maxSize > 0 && amt > maxSize) {
    amt = maxSize;
    if (inputEl) inputEl.value = amt.toLocaleString('zh-CN');
    showToast('赎回金额不能超过当前可用额度' + maxSize.toLocaleString('zh-CN') + '元，已按最大可赎回金额调整。');
  }
  st.lossRedeemAmt[code] = amt;
  recalcCurrent();
}

// 收益分配模式：用户逐行输入分配收益；系统按其占总收益比例生成只读申购金额。
function onSubAmountChange(code, value) {
  const st = getState(currentAccountId);
  if (!st) return;
  const inputEl = document.getElementById('profitAllocationInput_' + code);
  const money = getMoneyInputAmount(value);
  syncMoneyInputElement(inputEl, money.normalized);
  if (!st.profitAllocationMap) st.profitAllocationMap = {};
  st.profitAllocationMap[code] = money.amount;
  recalcCurrent();
}

// 全赎（逐产品）：勾选该产品并带入其全部持仓金额（可二次修改）
function onAllRedeemOne(code) {
  const acc = getAccount(currentAccountId);
  const st = getState(currentAccountId);
  if (!acc || !st) return;
  const p = acc.holdings.find(h => h.code === code);
  if (!p) return;

  if (!st.lossSelectedMap) st.lossSelectedMap = {};
  if (!st.lossRedeemAmt) st.lossRedeemAmt = {};
  st.lossSelectedMap[code] = true;
  st.lossRedeemAmt[code] = p.size || 0;

  // 直接更新勾选框和金额输入框，不重新渲染（避免横向滚动条复位）
  const chk = document.getElementById('lossChk_' + code);
  if (chk) chk.checked = true;
  const input = document.getElementById('lossRedeemInput_' + code);
  if (input) input.value = (p.size || 0).toLocaleString('zh-CN');

  updateHeaderCheckbox();
  recalcCurrent();
}

// 调仓模式勾选产品（赎回端）
function onLossToggleSelect(code, checked) {
  const st = getState(currentAccountId);
  if (!st) return;
  if (!st.lossSelectedMap) st.lossSelectedMap = {};
  if (!st.subSelectedMap) st.subSelectedMap = {};
  if (!st.subAmountMap) st.subAmountMap = {};
  if (!st.profitAllocationMap) st.profitAllocationMap = {};
  st.lossSelectedMap[code] = checked;
  // 监管互斥：左栏勾选 → 右栏同产品取消勾选+清零申购金额
  if (checked) {
    st.subSelectedMap[code] = false;
    st.subAmountMap[code] = 0;
    st.profitAllocationMap[code] = 0;
  }
  refreshAllRedeemBtn(code);
  // 重新渲染以更新右栏checkbox的disabled/title状态
  const acc = getAccount(currentAccountId);
  if (acc) { saveCurrentState(); renderContent(acc, st); }
  recalcCurrent();
}

// 申购端（右栏）勾选产品
function onSubToggleSelect(code, checked) {
  const st = getState(currentAccountId);
  if (!st) return;
  if (!st.lossSelectedMap) st.lossSelectedMap = {};
  if (!st.subSelectedMap) st.subSelectedMap = {};
  if (!st.lossRedeemAmt) st.lossRedeemAmt = {};
  st.subSelectedMap[code] = checked;
  // 监管互斥：右栏勾选 → 左栏同产品取消勾选+清零赎回金额
  if (checked) {
    st.lossSelectedMap[code] = false;
    st.lossRedeemAmt[code] = 0;
  }
  // 重新渲染以更新左栏checkbox的disabled/title状态
  const acc = getAccount(currentAccountId);
  if (acc) { saveCurrentState(); renderContent(acc, st); }
  recalcCurrent();
}


// 刷新「全赎」按钮的禁用状态（仅需：未锁定 + 已勾选；是否已选来源由点击时校验弹提示）
function refreshAllRedeemBtn(code) {
  const st = getState(currentAccountId);
  const btn = document.getElementById('allRedeemBtn_' + code);
  if (!btn || !st) return;
  const isLocked = st.status === 'done';
  const sel = (st.lossSelectedMap && st.lossSelectedMap[code] !== false);
  btn.disabled = isLocked || !sel;
}

function updateHeaderCheckbox() {

let pendingRevokeId = null;

function removeAccount(accountId) {
  if (isAdjustHistoryMode()) { showToast('历史日期为只读，不支持移除专户'); return; }
  // 已清仓（终态）：不存在「调仓 → 同步」流程，无需撤销同步，直接移出左侧栏（仅清理可见性）
  const rmStat = getSpvStatusById(accountId);
  if (rmStat.terminated) {
    leftListIds.delete(accountId);   // 只从左侧栏可见集合移除，保留 allAccounts/spvMaintList 作为业务档案
    renderSidebar();
    if (currentAccountId === accountId) {
      currentAccountId = null;
      renderAdjustEmptyState();
    }
    showToast('已从左侧列表移出（该专户在「专户产品维护」中仍为已清仓，业务档案保留）');
    return;
  }

  const st = getState(accountId);

  // 账户尚未加入左侧栏（或已被清理）：仅确保可见性标记被清掉，不删除 allAccounts 数据。
  // 数据池 allAccounts 是候选池来源，删除会导致该专户无法再被「+ 添加」找回。
  if (!leftListIds.has(accountId)) {
    renderSidebar();
    showToast('该专户不在左侧栏中');
    return;
  }

  if (!st) return;

  // 已同步（done）：需要先撤销同步
  if (st.status === 'done') {
    pendingRevokeId = accountId;
    showRevokeModal(accountId);
    return;
  }

  const acc = getAccount(accountId);
  showConfirmDialog({
    title: '移除专户',
    bodyHTML: '<p style="font-size:14px;color:var(--text);">移除“<strong>' + escHtml(acc ? acc.name : accountId) + '</strong>”将清除其当前草稿，是否继续？</p>',
    confirmText: '确认移除',
    danger: true,
    onConfirm: () => removeAccountDraft(accountId)
  });
}

function removeAccountDraft(accountId) {
  clearAdjustDraft(accountId);
  // 未同步：仅从左侧栏可见性集合移除。
  // 关键：不得从 allAccounts 删除——allAccounts 是「+ 添加」候选池的数据源，
  //       删除会导致该专户彻底消失、无法再被找回（临时专户/已下线专户尤其明显）。
  //       移除语义 = 取消左侧栏展示，业务档案与持仓数据保留。
  leftListIds.delete(accountId);

  // 如果移除的是当前选中项，切到列表中第一个剩余专户（无则清空）
  if (accountId === currentAccountId) {
    const rest = getSidebarItems();
    currentAccountId = rest.length > 0 ? rest[0].id : null;
  }

  renderSidebar();
  if (currentAccountId) {
    const acc = getAccount(currentAccountId);
    const st2 = getState(currentAccountId);
    if (acc && st2) renderContent(acc, st2);
  } else {
    renderAdjustEmptyState();
  }
}

function showRevokeModal(accountId) {
  const acc = getAccount(accountId);
  const st = getState(accountId);
  if (!acc || !st) return;

  const modeLabel = '调仓（' + (st.subMode === 'bp' ? 'BP分摊' : '收益分配') + '）';
  document.getElementById('revokeModalBody').innerHTML = `
    <div class="info-line"><span class="info-label">专户</span><span class="info-value">${acc.name}（${acc.code}）</span></div>
    <div class="info-line"><span class="info-label">模式</span><span class="info-value">${modeLabel}</span></div>
    <div class="info-line"><span class="info-label">状态</span><span class="info-value" style="color:var(--success);">已同步至头寸管理计算</span></div>
    <div style="margin-top:12px;padding:10px;background:#FEF2F2;border-radius:6px;color:#991B1B;font-size:13px;">
      ⚠️ 该专户已同步至头寸管理计算，移除前必须先撤销同步，以释放头寸额度。<br>确认撤销后，头寸系统中的调仓指令将被撤销。
    </div>
  `;
  document.getElementById('revokeModal').classList.add('show');
}

function closeRevokeModal() {
  document.getElementById('revokeModal').classList.remove('show');
  pendingRevokeId = null;
}

function confirmRevoke() {
  if (isAdjustHistoryMode()) { closeRevokeModal(); showToast('历史日期为只读，不支持撤销同步'); return; }
  if (!pendingRevokeId) return;
  // Demo中模拟撤销同步：将状态改回progress，然后移除
  const st = getState(pendingRevokeId);
  if (st) {
    st.status = 'progress';
    console.log('已撤销头寸系统中的调仓指令：' + pendingRevokeId);
  }
  closeRevokeModal();
  // 现在可以移除了（状态已不是done）
  const id = pendingRevokeId;
  pendingRevokeId = null;
  // 直接调用移除逻辑（状态已改回progress）
  const idx = allAccounts.findIndex(a => a.id === id);
  if (idx === -1) return;
  if (id === currentAccountId) {
    allAccounts.splice(idx, 1);
    delete accountState[id];
    leftListIds.delete(id);  // v2 同步：清掉左侧栏可见性标记
    if (allAccounts.length > 0) {
      currentAccountId = allAccounts[Math.min(idx, allAccounts.length - 1)].id;
    } else {
      currentAccountId = null;
    }
  } else {
    allAccounts.splice(idx, 1);
    delete accountState[id];
    leftListIds.delete(id);
  }
  renderSidebar();
  showToast('已撤销同步并移出左侧列表');
  if (currentAccountId) {
    const acc = getAccount(currentAccountId);
    const st2 = getState(currentAccountId);
    if (acc && st2) renderContent(acc, st2);
  } else {
    renderAdjustEmptyState();
  }
}

// 同日反向交易拦截：同一专户同一自然日，单产品同时存在申购+赎回
function validateReverseTrade(acc, st) {
  // 监管互斥兜底校验：同一产品不可同时在赎回端+申购端有有效金额
  const products = [];
  acc.holdings.forEach(p => {
    const lossSel = (st.lossSelectedMap && st.lossSelectedMap[p.code] !== undefined) ? st.lossSelectedMap[p.code] : true;
    const subSel = (st.subSelectedMap && st.subSelectedMap[p.code] !== undefined) ? st.subSelectedMap[p.code] : false;
    const redAmt = st.lossRedeemAmt?.[p.code] || 0;
    const subAmt = st.subAmountMap?.[p.code] || 0;
    // 两端都有勾选且都有有效金额 → 违规
    if (lossSel && subSel && redAmt > 0 && subAmt > 0) {
      products.push({
        code: p.code,
        name: p.name,
        reason: '赎回金额 ' + redAmt.toLocaleString('zh-CN') + ' 元 / 申购金额 ' + subAmt.toLocaleString('zh-CN') + ' 元，同日反向交易'
      });
    }
  });
  return { hasReverse: products.length > 0, products };
}

let pendingSyncData = null; // 待确认的同步数据

function syncToSystem() {
  if (isAdjustHistoryMode()) { showToast('历史日期为只读，不支持同步至头寸管理'); return; }
  const acc = getAccount(currentAccountId);
  const st = getState(currentAccountId);
  if (!acc || !st) return;

  // 申购端候选池 = 用户手动添加的申购产品清单（右栏初始为空，左栏仍仅限持仓）
  const subProductPool = st.subExtraProducts || [];

  recalcCurrent(); // 提交前重算，避免使用旧模式或旧输入的金额
  pendingSyncData = null;
  // ========== 同步前校验（收集全部问题，一次性提示） ==========
  const errors = [];
  const moneyMaps = [st.lossRedeemAmt, ...(st.subMode === 'wan' ? [st.profitAllocationMap] : [])];
  moneyMaps.forEach(map => Object.entries(map || {}).forEach(([code, value]) => {
    if (!Number.isFinite(value) || value < 0) errors.push(code + '：金额必须为非负有效数字。');
  }));
  acc.holdings.forEach(p => {
    const sel = st.lossSelectedMap && st.lossSelectedMap[p.code] === true;
    const redAmt = st.lossRedeemAmt?.[p.code] || 0;
    if (sel && redAmt <= 0) errors.push(p.code + '：请填写大于0的赎回金额；不参与本次调仓请取消勾选。');
  });


  if (st.subMode === 'bp') {
    // BP驱动模式：校验调整BP与目标BP有效性（目标BP合计不得超过调整BP，允许少分）。
    let hasBP = false, detailBpTotal = 0;
    subProductPool.forEach(p => {
      const sel = (st.subSelectedMap && st.subSelectedMap[p.code] !== undefined) ? st.subSelectedMap[p.code] : false;
      if (sel && (st.bpData[p.code] || 0) > 0) {
        hasBP = true;
        detailBpTotal += st.bpData[p.code] || 0;
      }
    });
    if ((st.totalLoss || 0) <= 0) errors.push('请输入调整BP');
    if (!hasBP) {
      errors.push('右侧无有效申购记录，请勾选理财产品并填写大于0的目标BP。');
    }
    if (Number.isFinite(st.totalLoss) && st.totalLoss > 0 && detailBpTotal > st.totalLoss) {
      errors.push('目标BP合计' + detailBpTotal + '，已超过调整BP' + st.totalLoss + '，请调整。');
    }
    subProductPool.forEach(p => {
      if (st.subSelectedMap?.[p.code] === false) return;      if (!Number.isFinite(st.bpData[p.code]) || st.bpData[p.code] <= 0) errors.push(p.code + '：目标BP必须为正整数。');
      if (Number.isFinite(st.totalLoss) && st.totalLoss > 0 && Number.isFinite(st.bpData[p.code]) && st.bpData[p.code] > st.totalLoss) errors.push(p.code + '：目标BP不得大于调整BP，单行占比不能超过100%。');
    });
  } else {
    // 收益分配模式：校验总收益是否已填、是否有勾选产品且分配收益>0、分配额是否超出总收益
    const totalProfit = st.totalProfit || 0;
    if (totalProfit <= 0) {
      errors.push('请输入大于0的总收益金额。');
    }
    let hasAmt = false, sumAssigned = 0;
    subProductPool.forEach(p => {
      const sel = (st.subSelectedMap && st.subSelectedMap[p.code] !== undefined) ? st.subSelectedMap[p.code] : false;
      const amt = st.profitAllocationMap?.[p.code] || 0;
      if (sel && amt > 0) { hasAmt = true; sumAssigned += amt; }
    });
    if (!hasAmt) {
      errors.push('右侧无有效申购记录，请勾选理财产品并填写大于0的分配收益金额。');
    }
    if (totalProfit > 0 && Math.round(sumAssigned * 100) > Math.round(totalProfit * 100)) {
      errors.push('分配收益合计' + sumAssigned.toLocaleString('zh-CN') + '元已超出本次可分配总收益' + totalProfit.toLocaleString('zh-CN') + '元，超出' + (sumAssigned - totalProfit).toLocaleString('zh-CN') + '元，请调整分配金额。');
    }
  }

  // 赎回侧：有勾选且有赎回金额的产品（左栏仅含持仓）
  const redeemSelected = acc.holdings.filter(p => {
    const sel = (st.lossSelectedMap && st.lossSelectedMap[p.code] !== undefined) ? st.lossSelectedMap[p.code] : true;
    const redAmt = st.lossRedeemAmt?.[p.code] || 0;
    return sel && redAmt > 0;
  });
  if (redeemSelected.length === 0) {
    errors.push('左侧无有效赎回记录，请勾选理财产品并填写大于0的赎回金额。');
  }

  // 赎回金额超限校验：单产品赎回金额不得超过其持有该专户的规模
  acc.holdings.forEach(p => {
    const sel = (st.lossSelectedMap && st.lossSelectedMap[p.code] !== undefined) ? st.lossSelectedMap[p.code] : true;
    const redAmt = st.lossRedeemAmt?.[p.code] || 0;
    if (sel && redAmt > (p.size || 0)) {
      errors.push(p.code + '赎回金额超过当前可用额度' + (p.size || 0).toLocaleString('zh-CN') + '元，请调整后重新确认。');
    }
  });

  // 资金来源必选校验：凡已勾选且有申购金额的产品，必须指定资金来源（不允许现金申购）
  subProductPool.forEach(p => {
    const sel = (st.subSelectedMap && st.subSelectedMap[p.code] !== undefined) ? st.subSelectedMap[p.code] : true;
    const subAmt = st.subAmountMap?.[p.code] || 0;
    if (!sel || subAmt <= 0) return;
    const srcId = (st.fundSourceMap && st.fundSourceMap[p.code]) || '';
    if (!srcId) {
      errors.push(p.code + '：请选择本笔申购对应的赎回来源专户。');
    }
  });

  // 资金来源专户状态校验：已清仓（终态）禁止作为配对赎回来源。
  subProductPool.forEach(p => {
    const sel = (st.subSelectedMap && st.subSelectedMap[p.code] !== undefined) ? st.subSelectedMap[p.code] : true;
    if (!sel) return;
    const srcId = (st.fundSourceMap && st.fundSourceMap[p.code]) || '';
    if (!srcId) return;
    const srcInfo = getOtherAccounts(p.code, acc.id).find(o => o.id === srcId);
    if (!srcInfo) return;  // 失效来源由下方规模校验兜底提示
    if (srcInfo.spvTerminated) {
      // 已清仓在渲染阶段已从下拉移除并清空绑定；此处为残留脏数据（如从旧缓存载入）兜底硬阻断。
      errors.push('赎回来源已失效，请重新选择。');
      if (st.fundSourceMap) st.fundSourceMap[p.code] = '';
    } else if (srcInfo.spvOnline === false) {
    }
  });
  // 资金来源规模校验：指定来源时，实际金额不得超过该产品持有来源专户的规模（与赎回超限校验同口径）
  subProductPool.forEach(p => {
    const sel = (st.subSelectedMap && st.subSelectedMap[p.code] !== undefined) ? st.subSelectedMap[p.code] : true;
    if (!sel) return;
    const srcId = (st.fundSourceMap && st.fundSourceMap[p.code]) || '';
    if (!srcId) return;  // 未指定来源已在上面拦截，此处仅校验已指定来源的规模
    // 来源规模从统一来源列表取（管理专户镜像 + SPV底层专户），与下拉选项同源
    const srcInfo = getOtherAccounts(p.code, acc.id).find(o => o.id === srcId);
    if (!srcInfo) { errors.push(p.code + "：赎回来源已失效，请重新选择。"); return; }
    // 已清仓来源不参与规模校验（已在上方状态校验中硬阻断并清空，避免重复报错）
    if (srcInfo.spvTerminated) return;
    const srcSize = srcInfo.size;
    const subAmt = st.subAmountMap?.[p.code] || 0;
    const adj = 0; // BP按公式生成最终金额，不允许调减
    const actual = subAmt - adj;
    if (actual > srcSize) {
      errors.push(p.code + '：配套赎回金额超过来源专户当前可用规模' + srcSize.toLocaleString('zh-CN') + '元，请调整。');
    }
  });

  // 申购侧：有勾选且有申购金额的产品
  const subSelected = subProductPool.filter(p => {
    const sel = (st.subSelectedMap && st.subSelectedMap[p.code] !== undefined) ? st.subSelectedMap[p.code] : true;
    const subAmt = st.subAmountMap?.[p.code] || 0;
    return sel && subAmt > 0;
  });
  if (subSelected.length === 0) {
    errors.push('右侧无有效申购记录，请勾选理财产品并填写大于0的分配BP或分配收益金额。');
  }

  if (redeemSelected.length === 0 && subSelected.length === 0) {
    const sideErrors = new Set([
      '左侧无有效赎回记录，请勾选理财产品并填写大于0的赎回金额。',
      '右侧无有效申购记录，请勾选理财产品并填写大于0的分配BP或分配收益金额。'
    ]);
    for (let i = errors.length - 1; i >= 0; i--) {
      if (sideErrors.has(errors[i])) errors.splice(i, 1);
    }
    errors.push('尚无有效交易，请填写申购和赎回信息。');
  }

  // 日终平衡校验
  let totalRedeemSync = 0, totalSubSync = 0;
  redeemSelected.forEach(p => { totalRedeemSync += st.lossRedeemAmt?.[p.code] || 0; });
  subSelected.forEach(p => { totalSubSync += st.subAmountMap?.[p.code] || 0; });
  if (errors.length > 0) {
    const msg = '以下项目未完成，请完善后再同步：\n\n' + errors.map((e, i) => (i + 1) + '. ' + e).join('\n');
    document.getElementById('syncModalBody').innerHTML = '<div style="padding:8px 0;font-size:14px;color:var(--text);white-space:pre-line;">' + msg.replace(/\n/g, '<br>') + '</div>';
    document.getElementById('syncModal').classList.add('show');
    document.getElementById('syncConfirmBtn').style.display = 'none';
    return;
  }
  document.getElementById('syncConfirmBtn').style.display = '';


  // 2. 合规校验：同日反向交易拦截
  const reverseCheck = validateReverseTrade(acc, st);
  if (reverseCheck.hasReverse) {
    showReverseTradeModal(reverseCheck);
    return;
  }

  let sumSub = 0, sumI = 0, sumRedAmt = 0;
  let subscribeProducts = [];
  let redeemProducts = [];

  // 申购侧（右栏）：BP模式读取计算金额；收益分配模式读取系统按分配收益生成的金额。
  subProductPool.forEach(p => {
    const sel = (st.subSelectedMap && st.subSelectedMap[p.code] !== undefined) ? st.subSelectedMap[p.code] : true;
    if (!sel) return;
    const subAmt = st.subAmountMap?.[p.code] || 0;
    if (subAmt <= 0) return;
    const bp = st.bpData[p.code] || 0;
    const adj = 0; // BP按公式生成最终金额，不允许调减
    const I_val = subAmt - adj;
    // 资金来源：指定来源的申购，同步时自动生成同产品、同金额的配套赎回流水
    // 名称从统一来源列表取（管理专户镜像 + SPV底层专户），与下拉选项同源
    const fundSrcId = (st.fundSourceMap && st.fundSourceMap[p.code]) || '';
    const fundSrcInfo = fundSrcId ? getOtherAccounts(p.code, acc.id).find(o => o.id === fundSrcId) : null;
    sumSub += subAmt; sumI += I_val;
    const allocationAmt = st.subMode === 'wan' ? (st.profitAllocationMap?.[p.code] || 0) : 0;
    subscribeProducts.push({ productScale: getBpProductScale(st, p.code), code: p.code, name: p.name.split('（')[0], bp, allocationAmt, subAmt, adj, I_val,
      fundSrcId, fundSrcName: fundSrcInfo ? fundSrcInfo.name : '' });
  });

  // 赎回侧（左栏）：读 lossRedeemAmt，赎回来源=当前专户
  acc.holdings.forEach(p => {
    const sel = (st.lossSelectedMap && st.lossSelectedMap[p.code] !== undefined) ? st.lossSelectedMap[p.code] : true;
    const redAmt = st.lossRedeemAmt?.[p.code] || 0;
    if (!sel || redAmt <= 0) return;
    sumRedAmt += redAmt;
    redeemProducts.push({ code: p.code, name: p.name.split('（')[0], redAmt });
  });

  // 保存待确认数据
  pendingSyncData = { acc, st, subscribeProducts, redeemProducts, sumSub, sumI, sumRedAmt };
  showSyncModal();
}

  const { acc, st, subscribeProducts, redeemProducts, sumSub, sumI, sumRedAmt } = data;
  const modeLabel = '调仓（' + (st.subMode === 'bp' ? 'BP分摊' : '收益分配') + '）';
  const diff = sumRedAmt - sumSub;
  const sumAssignedProfit = subscribeProducts.reduce((sum, p) => sum + p.allocationAmt, 0);

  let tableHTML = '';
  if (subscribeProducts.length > 0) {
    const isBP = st.subMode === 'bp';

      : `<th>产品代码</th><th class="pname">产品名称</th><th style="text-align:right;">分配收益金额</th><th style="text-align:right;">申购金额</th><th>赎回来源</th>`;
    tableHTML += '</tr></thead><tbody>';
    subscribeProducts.forEach(p => {
      tableHTML += '<tr>';
      tableHTML += `<td style="font-weight:500;">${p.code}</td><td class="pname">${p.name}</td>${isBP ? `<td class="num">${p.bp} BP / ${p.productScale.toLocaleString('zh-CN')}</td>` : `<td class="num" style="font-weight:600;color:#6D28D9;">${(p.allocationAmt/10000).toLocaleString()}万</td>`}`;
      tableHTML += `<td class="num" style="font-weight:600;">${(p.subAmt/10000).toLocaleString()}万</td>`;
      tableHTML += `<td class="src-cell" style="font-size:12px;${p.fundSrcName ? 'color:#C2410C;font-weight:600;' : 'color:#94A3B8;'}">${p.fundSrcName || '未指定'}</td>`;
      tableHTML += '</tr>';
    });
    tableHTML += '</tbody></table>';
    // 配套赎回：指定资金来源的申购，同步时自动生成的同产品、同金额赎回流水
    const pairedRedeems = subscribeProducts.filter(p => p.fundSrcId);
    if (pairedRedeems.length > 0) {
      tableHTML += '<div style="font-size:13px;font-weight:600;color:#C2410C;margin:12px 0 6px;">配套赎回（系统自动生成 · 同产品同金额，写入来源专户）</div>';
      tableHTML += '<table class="spv-table"><thead><tr>';
      tableHTML += `<th>产品代码</th><th class="pname">产品名称</th><th>赎回来源专户</th><th style="text-align:right;">赎回金额</th>`;
      tableHTML += '</tr></thead><tbody>';
      pairedRedeems.forEach(p => {
        tableHTML += '<tr>';
        tableHTML += `<td style="font-weight:500;">${p.code}</td><td class="pname">${p.name}</td><td class="src-cell" style="font-weight:600;color:#C2410C;">${p.fundSrcName}</td>`;
        tableHTML += `<td class="num" style="font-weight:600;color:#C2410C;">${(p.I_val/10000).toLocaleString()}万</td>`;
        tableHTML += '</tr>';
      });
      tableHTML += '</tbody></table>';
      tableHTML += '<div style="font-size:11px;color:#64748B;margin-top:4px;">注：系统自动生成同金额配套赎回（一申配一赎、同产品同金额）；当日资金影响按到账时效计算</div>';
    }
  }
  if (redeemProducts.length > 0) {
    tableHTML += '<div style="font-size:13px;font-weight:600;color:var(--primary);margin:12px 0 6px;">赎回侧（从当前专户赎回：' + acc.name + '）</div>';
    tableHTML += '<table class="spv-table"><thead><tr>';
    tableHTML += `<th>产品代码</th><th class="pname">产品名称</th><th style="text-align:right;">赎回金额</th>`;
    tableHTML += '</tr></thead><tbody>';
    redeemProducts.forEach(p => {
      tableHTML += '<tr>';
      tableHTML += `<td style="font-weight:500;">${p.code}</td><td class="pname">${p.name}</td>`;
      tableHTML += `<td class="num" style="font-weight:600;">${(p.redAmt/10000).toLocaleString()}万</td>`;
      tableHTML += '</tr>';
    });
    tableHTML += '</tbody></table>';
  }


  document.getElementById('syncModalBody').innerHTML = `
    ${st.subMode === "bp" && rebalanceDifference(sumRedAmt, sumSub) !== 0 ? '<div style="padding:10px 12px;margin-bottom:12px;background:#FFF7ED;border:1px solid #FDBA74;border-radius:6px;color:#9A3412;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + rebalanceMessage(sumRedAmt, sumSub) + '</div>' : ''}
    <div class="info-line"><span class="info-label">模式</span><span class="info-value">${modeLabel}</span></div>
    <div class="info-line"><span class="info-label">当前专户</span><span class="info-value">${acc.name}（${acc.code}）</span></div>
    <div class="info-line"><span class="info-label">汇总</span><span class="info-value">申购 ${subscribeProducts.length} 只 · 赎回 ${redeemProducts.length} 只</span></div>
    ${tableHTML}
  `;
  document.getElementById('syncModal').classList.add('show');
}

function closeSyncModal() {
  document.getElementById('syncModal').classList.remove('show');
  pendingSyncData = null;
}

function confirmSync() {
  if (isAdjustHistoryMode()) { closeSyncModal(); showToast('历史日期为只读，不支持同步至头寸管理'); return; }
  if (!pendingSyncData) return;
  if (pendingSyncData.st.status === 'done') return;
  // 最终确认再次执行完整校验，任何输入或日期变化都会阻断旧指令。
  syncToSystem();
  const data = pendingSyncData;
  if (!data) return;
  const { acc, st, subscribeProducts, redeemProducts } = data;

  // 同步：不修改理财产品维护的固定上线清单，仅写入 positionData
  function ensureRow(code, name) {
    let posRow = positionData.find(r => r.code === code);
    if (!posRow) {
      posRow = createDefaultPositionRow(code, name);
      positionData.push(posRow);
    }
    if (!posRow._spv) posRow._spv = {};
    return posRow;
  }

  // 1) 赎回侧：写赎回金额到当前专户（赎回来源=当前专户）
  redeemProducts.forEach(p => {
    const posRow = ensureRow(p.code, p.name);
    if (!posRow._spv[acc.id]) posRow._spv[acc.id] = { sub: null, red: null, subManual: 0, subRebalance: 0, redManual: 0, redRebalance: 0 };
    const spv = posRow._spv[acc.id];
    spv.redRebalance += p.redAmt;
    spv.red = (spv.red || 0) + p.redAmt;
  });

  // 2) 申购侧：写实际金额到当前操作专户
  subscribeProducts.forEach(p => {
    const posRow = ensureRow(p.code, p.name);
    if (!posRow._spv[acc.id]) posRow._spv[acc.id] = { sub: null, red: null, subManual: 0, subRebalance: 0, redManual: 0, redRebalance: 0 };
    const curSpv = posRow._spv[acc.id];
    curSpv.subRebalance += p.I_val;
    curSpv.sub = (curSpv.sub || 0) - p.I_val;
  });

  // 3) 配套赎回：指定资金来源的申购，自动生成同产品、同金额的赎回流水（写入来源专户），
  //    使该产品当日头寸净变动为 0（申购流出 = 赎回流入），头寸表自动平衡
  subscribeProducts.forEach(p => {
    if (!p.fundSrcId) return;  // 未指定来源不生成配套赎回；提交校验会阻断有效申购
    const posRow = ensureRow(p.code, p.name);
    if (!posRow._spv[p.fundSrcId]) posRow._spv[p.fundSrcId] = { sub: null, red: null, subManual: 0, subRebalance: 0, redManual: 0, redRebalance: 0 };
    const srcSpv = posRow._spv[p.fundSrcId];
    srcSpv.redRebalance += p.I_val;
    srcSpv.red = (srcSpv.red || 0) + p.I_val;
  });

  savePositionData();
  clearAdjustDraft(currentAccountId);
  data.st.status = 'done';
  closeSyncModal();
  renderSidebar();
  const acc2 = getAccount(currentAccountId);
  const st2 = getState(currentAccountId);
  if (acc2 && st2) renderContent(acc2, st2);
  showToast('已同步至头寸管理计算，可继续处理其他专户');
}

// ==================== 头寸数据日期（调仓/拉壳计算依据） ====================
// 实际系统 = 最近一次成功上传的「日初头寸」文件数据日期，由上传动作驱动；
// Demo 中为静态模拟值，可用控制台调用 simPositionDataDate('today') / simPositionDataDate('2026-06-04') 切换两种提示状态
let positionDataDate = '2026-06-04';
function getTodayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
// ⚠️ Demo 演示开关：同步头寸时「头寸数据必须为当日」的硬校验在演示环境默认放行。
// 原因：头寸数据日期是静态模拟值（2026-06-04），而系统当前日期是真实的，
//       两者永远对不上 → 每次同步都被拦下，无法演示后续流程。
// 正式系统必须恢复此校验（真实场景下基于历史头寸的调仓金额确实不可用）。
const DEMO_SKIP_POSITION_DATE_CHECK = true;
// Demo 数据版本：每次修改默认数据/演示示例后递增。用于在本地缓存中识别旧数据结构，自动清理避免旧缓存污染新 Demo。
const DEMO_DATA_VERSION = '20250918c';
// 演示环境：直接把「头寸数据日期」锚定为今天，使新鲜度判断、页面日期标签、同步校验三者保持一致。
// （仅覆写演示变量，不触碰真实读取逻辑；DEMO_SKIP_POSITION_DATE_CHECK 作为双保险保留）
try {
  if (DEMO_SKIP_POSITION_DATE_CHECK) positionDataDate = (function(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  })();
} catch(e) {}
function isPositionFresh() { return DEMO_SKIP_POSITION_DATE_CHECK || positionDataDate === getTodayStr(); }
let adjustTradeDate = getTodayStr();
function isAdjustHistoryMode() {
  return adjustTradeDate !== getTodayStr();
}
function renderAdjustDateBar() {

  const btn = document.getElementById('adjustTodayBtn');

  input.max = today;
  input.value = adjustTradeDate;

  tag.textContent = history ? ('历史记录：' + adjustTradeDate + '，只读') : '';
  tag.style.display = history ? 'inline-flex' : 'none';
  if (btn) btn.disabled = !history;
}

  const today = getTodayStr();
  adjustTradeDate = value || today;
  if (adjustTradeDate > today) adjustTradeDate = today;
  restoreAdjustDraftSidebar();
  renderAdjustDateBar();
  renderSidebarAddSelect();
  renderSidebar();

    const acc = getAccount(currentAccountId);

    renderAdjustEmptyState();
  }
}
function goAdjustToday() {

}
function renderAdjustEmptyState() {

// 是否处于历史查看模式
function isHistoryMode() {
  return positionViewDate !== POSITION_TODAY;
}

// 构建某历史日期的头寸快照：
// 口径说明（Demo 模拟，实际由系统按日归档）：
//  1) 日初头寸 = 当日「修改前日终申赎」（即当日轧差后的日终头寸），保证跨日衔接连续；
//  2) 申赎/付费/T+1/银行交易所 等当日发生额，历史日无流水记录 → 归零；
//  3) 专户调仓数据为「当日」概念，历史日不展示（自然申赎保留）。
function getHistorySnapshot(date) {
  if (historySnapshotCache[date]) return historySnapshotCache[date];
  const byCode = {};
  positionData.forEach(row => {
    const r = { ...row };
    // 当日日终头寸 = 修改前日终申赎（先算一次，取轧差后的结果）
    const probe = { ...row };
    calcPositionRow(probe);
    r.dayBegin = Math.round(probe.beforeMod || probe.srSum || 0);
    r.subAll = 0; r.redAll = 0; r.fee = 0; r.t1Back = 0; r.bankExch = 0;
    r.date = date;
    delete r.totalSub; delete r.totalRed; delete r.srSum; delete r.beforeMod; delete r.afterMod;
    // 专户：清除调仓金额，保留自然申赎（历史日无当日调仓指令）
    if (row._spv) {
      r._spv = {};
      Object.keys(row._spv).forEach(sid => {
        const sd = row._spv[sid];
        r._spv[sid] = {
          sub: sd.subManual || null,
          red: sd.redManual || null,
          subManual: sd.subManual || 0,
          subRebalance: 0,
          redManual: sd.redManual || 0,
          redRebalance: 0,
        };
      });
    }
    byCode[row.code] = r;
  });
  // 历史快照专户列表 = 当时的在线专户（Demo 简化为当前在线专户）
  const snapshot = { date, byCode };
  historySnapshotCache[date] = snapshot;
  return snapshot;
}

// 重建某历史日期的完整头寸行数组（对齐 positionData 结构，供 calcPositionRow 重算）
function buildHistoryPositionData(date) {
  const snap = getHistorySnapshot(date);
  const result = [];
  positionData.forEach(row => {
    const src = snap.byCode[row.code];
    if (!src) return;
    const r = {
      ...src,
      _spv: src._spv ? JSON.parse(JSON.stringify(src._spv)) : {},
    };
    result.push(r);
  });
  return result;
}

function initSpvMaintList() {
  try {
    const saved = localStorage.getItem('spv_maint_list');
    if (saved) {
      const list = JSON.parse(saved);
      if (Array.isArray(list) && list.length > 0) {
        // 合并：补充 allAccounts 中存在但 saved 中缺失的专户（默认上线，排到最后）
        // 注意：临时专户（_temp:true）跳过自动补录 —— 临时专户不在维护清单中，
        //       否则失去"临时"语义，getPositionSpvColumns 不会将其置顶并打"临时"徽章。
        const savedIds = new Set(list.map(p => p.id));
        const missing = allAccounts
          .filter(a => !savedIds.has(a.id) && !a._temp)
          .map((a, i) => ({ id: a.id, online: true, terminated: false, sortOrder: list.length + i + 1, tVal: a.tVal, nature: a.nature || '债券专户', shortName: a.shortName || a.name }));
        // 清理：saved 中残留的临时专户条目也一并过滤（兼容旧缓存残留）
        const cleaned = list.filter(p => {
          const acc = allAccounts.find(a => a.id === p.id);
          return !(acc && acc._temp);
        });
        // 补字段：旧缓存无 terminated，默认 false
        cleaned.forEach(p => { if (p.terminated === undefined) p.terminated = false; });
        return cleaned.concat(missing);
      }
    }
  } catch(e) {}
  // 兜底：默认从 allAccounts 派生时，同样排除 _temp 专户
  return allAccounts
    .filter(a => !a._temp)
    .map((a, idx) => ({ id: a.id, online: true, terminated: false, sortOrder: idx + 1, tVal: a.tVal, nature: a.nature || '债券专户', shortName: a.shortName || a.name }));
}

// ==================== 理财产品维护 - 完整数据模型 ====================
// 产品维护列表：从 positionData 构建，每行包含上线状态、排序序号、活期配置
// productMaintList: [{ code, name, online, sortOrder, calcLive }]
// online: true=已上线（在头寸管理中显示）, false=已下线
// sortOrder: 显示排序序号（1-based）
// calcLive: true=计算活期, false=不计算活期

const DEFAULT_CURRENT_CONFIG = {
  'EW0599': false, 'EW0580': false, 'EW1340': false, 'EW0515': false,
  'EW7746': false, 'EW7748': false, 'EW4659': false, 'EW6287': false,
  'EW5208': false, 'EW5231': false, 'EW2911': false, 'EW1390': false,
  'EW4217': false, 'EW4512': false,
};

// 初始化产品维护列表（首次加载时从 positionData 构建）
function initProductMaintList() {
  try {
    const saved = localStorage.getItem('product_maint_list');
    if (saved) {
      const list = JSON.parse(saved);
      if (Array.isArray(list) && list.length > 0) {
        // 合并：补充 positionData 中存在但 saved 中缺失的产品（默认上线）
        const savedCodes = new Set(list.map(p => p.code));
        const missing = positionData
          .filter(p => !savedCodes.has(p.code))
          .map((p, idx) => ({
            code: p.code,
            name: p.name,
            online: true,
            sortOrder: list.length + idx + 1,
            calcLive: DEFAULT_CURRENT_CONFIG[p.code] !== false
          }));
        return list.concat(missing);
      }
    }
  } catch(e) {}
  // 默认：所有产品上线，按 positionData 顺序排列，活期按 DEFAULT_CURRENT_CONFIG
  return positionData.map((p, idx) => ({
    code: p.code,
    name: p.name,
    online: true,
    sortOrder: idx + 1,
    calcLive: DEFAULT_CURRENT_CONFIG[p.code] !== false
  }));
}

let productMaintList = initProductMaintList();

function saveProductMaintList() {
  try {
    localStorage.setItem('product_maint_list', JSON.stringify(productMaintList));
  } catch(e) {}
}

// 获取已上线产品（按 sortOrder 排序），供头寸管理页面使用
function getOnlineProducts() {
  return productMaintList
    .filter(p => p.online)
    .sort((a, b) => a.sortOrder - b.sortOrder);
}

// 判断某产品是否计算活期（从 productMaintList 读取，未找到时默认 true）
function shouldCalcCurrent(code) {
  const item = productMaintList.find(p => p.code === code);
  if (item) return item.calcLive !== false;
  return true; // 不在维护列表中的产品默认计算活期
}

// 为没有专户数据的产品生成默认数据
function getSPVData(productCode) {
  if (spvHoldingsData[productCode]) return spvHoldingsData[productCode];
  // 前 4 只产品持仓较少，用于展示超额赎回预警效果
  const demoWarnCodes = ['EW3517','EW0599','EW4217','EW2911'];
  const isWarn = demoWarnCodes.includes(productCode);

  // 模拟 6 个专户，净值/渠道各不相同
  // 已取消：不再挂载虚构的「已清仓专户」示例，Demo 中资金来源下拉只展示实际可选来源。
  //       真实系统的已清仓专户由维护清单置 terminated=true 后自动从资金来源下拉中排除。
  const baseSpv = [
    { spvCode:'ZTQX08', spvName:'中铁信托-乾鑫8号集合资金信托计划', nav:1.11146787, channel:'直销' },
    { spvCode:'2021-1147', spvName:'华润信托·招利33号集合资金信托', nav:1.10354761, channel:'直销' },
    { spvCode:'ZTYS19', spvName:'中铁信托-云升19号集合资金信托计划', nav:1.02370411, channel:'直销' },
    { spvCode:'6666666666', spvName:'国联光盈多策略18号集合资产管理计划', nav:1.0257, channel:'基煜' },
    { spvCode:'SAGP35', spvName:'光大期货阳光甄选8号集合资产管理计划', nav:1.0111, channel:'基煜' },
    { spvCode:'B42146', spvName:'国联光盈多策略19号集合资产管理计划', nav:1.0513, channel:'基煜' },
  ];

  // 用产品代码生成种子，决定每只产品持有几个专户、多少份额
  let seed = 0;
  for (let i = 0; i < productCode.length; i++) seed = (seed * 31 + productCode.charCodeAt(i)) % 997;
  const holdCount = 4 + (seed % 3); // 持有 4~6 个专户

  return baseSpv.slice(0, holdCount).map((spv, i) => {
    const qty = isWarn
      ? (i + 1) * 5000000
      : Math.round((seed % 8 + 1) * 20000000 + i * 8000000);
    const scale = Math.round(qty * spv.nav);
    return { ...spv, navDate:'2026-06-27', qty, scale, subAmt:0, redAmt:0 };
  });
}

    const spvMaint = spvMaintList.find(s => {
      const acc = allAccounts.find(a => a.id === s.id);
      return acc && acc.code === h.spvCode;
    });
    return {
      code: h.spvCode,
      name: h.spvName,
      tVal: spvMaint ? spvMaint.tVal : 'T+0',
      nature: spvMaint ? spvMaint.nature : (() => {
        const demoNatures = ['债券专户', '权益专户', '多资产专户', '定制货币', '存款专户'];
        return demoNatures[h.spvCode.length % demoNatures.length];

      navDate: h.navDate || navDate,
      channel: h.channel || '直销',
      qty: h.qty,

  // 计算 T+0/T+1 占比和各性质占比
  const totalHoldScale = totalScale || 1;
  const t0Scale = holdings.filter(h => h.tVal === 'T+0').reduce((s, h) => s + h.scale, 0);
  const t1Scale = holdings.filter(h => h.tVal !== 'T+0').reduce((s, h) => s + h.scale, 0);
  const natureTypes = ['债券专户', '权益专户', '多资产专户', '定制货币', '存款专户'];
  const natureStats = natureTypes.map(nt => {
    const scale = holdings.filter(h => h.nature === nt).reduce((s, h) => s + h.scale, 0);

// ==================== 头寸管理 - 计算逻辑 ====================

function calcPositionRow(row) {
  // 申赎合计 = 日初头寸 + 申购总额 + 赎回总额 + 付费 + T+1回款 + 银行交易所资金汇总
  row.srSum = row.dayBegin + row.subAll + row.redAll + row.fee + row.t1Back + row.bankExch;

  // 净申赎 = (申购总额 + 赎回总额) × 95% + 付费 + T+1回款 + 银行交易所资金汇总
  const netSR = (row.subAll + row.redAll) * 0.95 + row.fee + row.t1Back + row.bankExch;

  // 总申购款：netSR > 0 时 = -ROUNDDOWN(netSR/10000)*10000
  if (netSR > 0) {
    row.totalSub = -Math.floor(netSR / 10000) * 10000;
  } else {
    row.totalSub = null;
  }

  // 需存活期款金额：(申购总额+赎回总额) > 0 时 = -ROUNDDOWN((subAll+redAll)*5%/10000)*10000
  if (shouldCalcCurrent(row.code) && row.subAll + row.redAll > 0) {
    row.needLiveAmt = -Math.floor(-(row.subAll + row.redAll) * 0.05 / 10000) * 10000;
  } else {
    row.needLiveAmt = null;
  }

  // 总赎回款：netSR < 0 时 = ROUNDUP(-netSR/10000)*10000
  if (netSR < 0) {
    row.totalRed = Math.ceil(-netSR / 10000) * 10000;
  } else {
    row.totalRed = null;
  }

  // 需取活期款金额：(申购总额+赎回总额) < 0 时 = ROUNDUP(-(subAll+redAll)*5%/10000)*10000
  if (shouldCalcCurrent(row.code) && row.subAll + row.redAll < 0) {
    row.needTakeLiveAmt = Math.ceil(-(row.subAll + row.redAll) * 0.05 / 10000) * 10000;
  } else {
    row.needTakeLiveAmt = null;
  }

  // 修改前-日终申赎 = 申赎合计 + 总申购款 + 总赎回款
  row.beforeMod = row.srSum + (row.totalSub || 0) + (row.totalRed || 0);

  // 修改后-日终申赎 暂同修改前（demo 中简化）
  row.afterMod = row.beforeMod;

  // 头寸状态判定：由 calcAutoStatus 实时计算（gap驱动）
  // posStatus 在 renderPositionPage 中根据 calcAutoStatus 动态赋值

  // 专户总申购款/总赎回款（模拟轧差数据）
  if (netSR > 500000) {
    row.spvSubTotal = -Math.round(netSR * 0.3 / 10000) * 10000;
    row.spvRedTotal = null;
  } else if (netSR < -500000) {
    row.spvSubTotal = null;
    row.spvRedTotal = Math.round(-netSR * 0.3 / 10000) * 10000;
  } else {
    row.spvSubTotal = null;
    row.spvRedTotal = null;
  }

  // 为每个展示专户生成申购/赎回金额模拟数据（保留已同步的专户调仓数据）
  if (!row._spv) row._spv = {};
  // 无理财产品持仓的专户（如新上线未建仓专户）不生成模拟数据，并清理旧缓存脏数据
  const onlineSpvs = getOnlineSpvList();
  onlineSpvs.forEach(spv => {
    if (!spv.holdings || spv.holdings.length === 0) delete row._spv[spv.id];
  });
  onlineSpvs.filter(spv => spv.holdings && spv.holdings.length > 0).forEach((spv, idx) => {
    // 手工编辑过的单元格（专户弹窗保存过）：保留人工录入与调仓拆分，不生成/覆盖模拟数据
    if (row._spv[spv.id] && row._spv[spv.id]._edited) {
      const ex = row._spv[spv.id];
      ex.subManual = ex.subManual || 0;
      ex.redManual = ex.redManual || 0;
      return;
    }
    if (row._spv[spv.id] && (row._spv[spv.id].subRebalance || row._spv[spv.id].redRebalance)) {
      // 已有专户调仓数据，只更新模拟的 manual 部分
      const existing = row._spv[spv.id];
      existing.subManual = existing.subManual || 0;
      existing.redManual = existing.redManual || 0;
      const seed = row.code.charCodeAt(row.code.length-1) + idx * 7;
      if (netSR > 500000) {
        existing.subManual = -(seed * 100000 + 500000);
        existing.sub = (existing.subManual || 0) - (existing.subRebalance || 0);
      } else if (netSR < -500000) {
        existing.redManual = (seed * 100000 + 500000);
        existing.red = (existing.redManual || 0) + (existing.redRebalance || 0);
      } else {
        existing.subManual = 0; existing.redManual = 0;
        existing.sub = existing.subRebalance || 0 ? -existing.subRebalance : null;
        existing.red = existing.redRebalance || 0 ? existing.redRebalance : null;
      }
    } else {
      // 无专户调仓数据，初始化模拟数据
      const seed = row.code.charCodeAt(row.code.length-1) + idx * 7;
      if (netSR > 500000) {
        row._spv[spv.id] = { sub: -(seed * 100000 + 500000), red: null, subManual: -(seed * 100000 + 500000), subRebalance: 0, redManual: 0, redRebalance: 0 };
      } else if (netSR < -500000) {
        row._spv[spv.id] = { sub: null, red: (seed * 100000 + 500000), subManual: 0, subRebalance: 0, redManual: (seed * 100000 + 500000), redRebalance: 0 };
      } else {
        // 已平衡示例产品（EW900x）：生成小额专户数据供演示弹窗只读效果
        // 申购与赎回金额设为相等值，确保 gap=0 始终判定为已平衡
        const isDemo = /^EW900/.test(row.code);
        const demoAmt = isDemo ? (seed * 50000 + 200000) : 0;
        const demoSub = isDemo ? -demoAmt : null;
        const demoRed = isDemo ? demoAmt : null;
        row._spv[spv.id] = { sub: demoSub, red: demoRed, subManual: isDemo ? demoSub : 0, subRebalance: 0, redManual: isDemo ? (demoRed || 0) : 0, redRebalance: 0 };
      }
    }
  });
}

// 演示用：构造一个「临时专户」（不在「专户产品维护」清单内，当日因调仓数据临时出现的专户）

// 注意：Demo 初始化【不再】自动注入本对象，避免左侧栏/候选池出现虚构的「某某信托·临时专户」。
//       如需在控制台临时验证临时专户逻辑，可执行：allAccounts.unshift(makeTempSpv()); renderSidebar();

  };

// 头寸管理页「展示用专户列」完整列表（对齐 getSpvPage / goSpvPage 的分页基数）
// 顺序：临时专户（置顶，便于第一时间感知） → 已上线专户（按维护排序） → 已下线/已清仓（末尾，带状态标）
// 说明1：临时专户置顶，是同步时首次出现/维护疏漏的信号，放在专户区第一列最易被察觉；
//       否则在几十个固定列中翻找极易漏看，导致同步进来的数据无人复核。
// 说明2：已下线专户若当日有调仓流水写入（如残留持仓出清），必须仍以列形式展示，
//       否则同步进去的数据会"看不见"、无法复核，形成孤儿数据。
function getPositionSpvColumns() {
  const base = getOnlineSpvList();
  const onlineIds = new Set(base.map(a => a.id));
  // 收集当日有调仓数据（subRebalance/redRebalance 非 0）的专户 id
  const rebalanceIds = new Set();
  positionData.forEach(row => {
    if (!row._spv) return;
    Object.entries(row._spv).forEach(([sid, sd]) => {
      if ((sd.subRebalance || 0) !== 0 || (sd.redRebalance || 0) !== 0) rebalanceIds.add(sid);
    });
  });
  // 已下线/已清仓但当日有调仓数据 → 追加为展示列（保证数据可见、可复核）
  const extra = [];
  const temp = [];
  rebalanceIds.forEach(sid => {
    if (onlineIds.has(sid)) return;
    const acc = allAccounts.find(a => a.id === sid);
    if (!acc) return;
    // 不在「专户产品维护」清单中 → 临时专户（置顶，第一列）
    const inMaintList = spvMaintList.some(p => p.id === sid);
    if (!inMaintList) {
      temp.push(acc);
      return;
    }
    const ms = getSpvStatusById(sid);
    if (ms.online && !ms.terminated) return;  // 状态正常则已在上线列表中
    extra.push({ ...acc, _offline: true, _spvStatusLabel: ms.label, _spvStatusKlass: ms.klass });
  });
  return temp.concat(base, extra);
}

function getSpvPage() {
  const list = getPositionSpvColumns();
  const start = spvPageIndex * SPV_PAGE_SIZE;
  return list.slice(start, start + SPV_PAGE_SIZE);
}

// 判断某专户列是否为「临时专户」：不在「专户产品维护」清单中，仅因当日有调仓数据临时展示。
// 与产品维度的「临时」判定（!onlineCodes.has(code) && hasRebalanceData(row)）保持同一语义。
function isTempSpvCol(spv) {
  if (!spv) return false;
  if (spv._temp) return true;
  const inMaintList = spvMaintList.some(p => p.id === spv.id);
  if (inMaintList) return false;
  // 不在维护清单，且当日确实有本专户的调仓数据 → 临时专户
  return positionData.some(row => {
    const sd = row._spv && row._spv[spv.id];
    return sd && ((sd.subRebalance || 0) !== 0 || (sd.redRebalance || 0) !== 0);
  });
}

function goSpvPage(dir) {
  const list = getPositionSpvColumns();
  const maxPage = Math.ceil(list.length / SPV_PAGE_SIZE) - 1;
  spvPageIndex = Math.max(0, Math.min(maxPage, spvPageIndex + dir));
  renderPositionPage();
}

  document.getElementById('tabProduct').style.display = tab === 'product' ? 'flex' : 'none';
  document.getElementById('tabSpv').style.display = tab === 'spv' ? 'flex' : 'none';
  document.getElementById('tabSpvQuery').style.display = tab === 'spvQuery' ? 'flex' : 'none';

  if (tab === 'position') {
    renderPositionPage();
  } else if (tab === 'adjust') {
    renderAdjustDateBar();
    renderSidebar();
    if (!currentAccountId) {
      // 未选择产品时显示空状态提示（v2 交互：用户从下拉选择并点击「+ 添加」）
      renderAdjustEmptyState();
    } else {
      const acc = getAccount(currentAccountId);
      const st = getState(currentAccountId);
      if (acc && st) renderContent(acc, st);
    }
  } else if (tab === 'product') {
    renderProductMaintPage();
  } else if (tab === 'spv') {
    renderSpvMaintPage();
  } else if (tab === 'spvQuery') {
    renderSpvQueryPage();
  }
}
